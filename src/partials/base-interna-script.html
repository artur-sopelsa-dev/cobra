<script>
/* Base comum das páginas internas: scroll suave, fundo de curvas, header, menu e revelações */
(function(){
  const root = document.documentElement; root.classList.add('js');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.add('reduce');
  const hasG = !!(window.gsap && window.ScrollTrigger);
  if (hasG){ gsap.registerPlugin(ScrollTrigger); ScrollTrigger.config({ ignoreMobileResize:true, autoRefreshEvents:'visibilitychange,DOMContentLoaded,load' }); }
  let lenis = null;
  if (!reduce && window.Lenis){
    lenis = new Lenis({ smoothWheel:false, syncTouch:false }); history.scrollRestoration='manual';
    if (hasG) ScrollTrigger.addEventListener('refresh', () => lenis && lenis.resize());
    if (hasG){ lenis.on('scroll', ScrollTrigger.update); gsap.ticker.add(t => lenis.raf(t*1000)); gsap.ticker.lagSmoothing(0); }
    else { const raf = t => { lenis.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf); }
  }
  const C = window.__cobra = window.__cobra || {}; C.lenis = lenis;
  C.scrollTo = (y, imm) => { if (lenis) lenis.scrollTo(y, { immediate: !!imm, duration: 1.3 }); else scrollTo({ top: typeof y === 'number' ? y : y.getBoundingClientRect().top + scrollY, behavior: imm ? 'auto' : 'smooth' }); };
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const h = a.getAttribute('href'); if (h.length < 2 || a.hasAttribute('data-route')) return;
    const el = document.getElementById(h.slice(1)); if (!el) return;
    e.preventDefault(); C.scrollTo(el);
  });

  /* ---------- fundo de curvas + cor por seção ---------- */
  function field(x,y,t){ return Math.sin(x + 1.7*Math.sin(y*0.8 + t*0.30)) + Math.sin(y*1.1 + 1.5*Math.sin(x*0.9 - t*0.25)) + 0.6*Math.sin((x+y)*0.7 + t*0.20); }
  const SEG = [[],[[3,2]],[[2,1]],[[3,1]],[[0,1]],[[3,0],[2,1]],[[0,2]],[[3,0]],[[3,0]],[[0,2]],[[0,1],[3,2]],[[0,1]],[[3,1]],[[2,1]],[[3,2]],[]];
  function contour(ctx,w,h,o,t){
    const c=o.cell, cols=Math.ceil(w/c)+1, rows=Math.ceil(h/c)+1, v=new Float32Array((cols+1)*(rows+1));
    for (let j=0;j<=rows;j++) for (let i=0;i<=cols;i++) v[j*(cols+1)+i]=field((i*c+o.ox)/o.scale,(j*c+o.oy)/o.scale,t);
    ctx.lineWidth=o.lw; ctx.strokeStyle=o.line;
    for (const L of o.levels){ ctx.beginPath();
      for (let j=0;j<rows;j++) for (let i=0;i<cols;i++){
        const a=v[j*(cols+1)+i], b=v[j*(cols+1)+i+1], d=v[(j+1)*(cols+1)+i], cc=v[(j+1)*(cols+1)+i+1];
        const k=(a>L?8:0)|(b>L?4:0)|(cc>L?2:0)|(d>L?1:0); if (k===0||k===15) continue;
        const x=i*c, y=j*c;
        const pt=e=>e===0?[x+c*(L-a)/(b-a),y]:e===1?[x+c,y+c*(L-b)/(cc-b)]:e===2?[x+c*(L-d)/(cc-d),y+c]:[x,y+c*(L-a)/(d-a)];
        for (const sg of SEG[k]){ const p1=pt(sg[0]),p2=pt(sg[1]); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); }
      } ctx.stroke(); }
  }
  C.contour = contour;
  function fit(cv, max){ const dpr=Math.min(max||1.5, devicePixelRatio||1), w=cv.clientWidth, h=cv.clientHeight; if (!w||!h) return null;
    if (cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return { ctx, w, h }; }
  C.fit = fit;
  const COL={ ink:[10,11,8], char:[27,30,21], paper:[238,240,227], lime:[203,226,46] };
  const secs=[...document.querySelectorAll('main .sec, footer')];
  const hdr=document.getElementById('hdr'), bgc=document.getElementById('topo');
  let bg=COL[(secs[0]&&secs[0].dataset.bg)||'ink'].slice(), tick=0, lastY=scrollY, first=true;
  const at = y => { let cur=secs.find(s=>s.offsetHeight)||secs[0]; for (const s of secs){ if (s.offsetHeight && s.getBoundingClientRect().top<=y) cur=s; } return cur; };
  function frame(t){
    if (secs.length){
      const s=at(innerHeight*.6); const tgt=COL[s.dataset.bg||'ink']; bg=bg.map((v,i)=>v+(tgt[i]-v)*.09);
      document.body.style.backgroundColor=`rgb(${bg.map(Math.round).join(',')})`;
      const hs=at(40); const tone=hs.dataset.tone||'ink'; if (hdr && hdr.dataset.tone!==tone) hdr.dataset.tone=tone;
    }
    const y=scrollY; if (hdr && !root.classList.contains('menu-open')){ if (y>lastY+6 && y>200) hdr.classList.add('hide'); else if (y<lastY-6) hdr.classList.remove('hide'); } lastY=y;
    tick++;
    if (bgc && (first || (!reduce && tick%4===0))){ const F=fit(bgc,1); if (F){ const light=(bg[0]+bg[1]+bg[2])/3>128; F.ctx.clearRect(0,0,F.w,F.h);
      contour(F.ctx,F.w,F.h,{cell:innerWidth<800?26:20,scale:150,levels:[-2,-1.5,-1,-.5,0,.5,1,1.5,2],lw:1,line:light?'rgba(10,11,8,.09)':'rgba(203,226,46,.07)',ox:0,oy:scrollY*.12},reduce?0:t*.0002); first=false; } }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- menu mobile ---------- */
  const burger=document.getElementById('burger');
  if (burger) burger.addEventListener('click', () => { const o=root.classList.toggle('menu-open'); burger.setAttribute('aria-expanded', String(o)); if (lenis) o ? lenis.stop() : lenis.start(); });
  document.querySelectorAll('.mnav a').forEach(a => a.addEventListener('click', () => { root.classList.remove('menu-open'); lenis && lenis.start(); }));

  /* ---------- revelações ---------- */
  function splitWords(el){ (function walk(node){ [...node.childNodes].forEach(n=>{
    if (n.nodeType===3){ const frag=document.createDocumentFragment(); n.textContent.split(/(\s+)/).forEach(p=>{ if (!p) return; if (/^\s+$/.test(p)){ frag.appendChild(document.createTextNode(p)); return; } const m=document.createElement('span'); m.className='wm'; const i=document.createElement('span'); i.className='wi'; i.textContent=p; m.appendChild(i); frag.appendChild(m); }); n.replaceWith(frag); }
    else if (n.nodeType===1 && !n.matches('svg,br')) walk(n); }); })(el); }
  C.splitWords = splitWords;
  C.reveal = function(scope){
    scope = scope || document;
    if (!hasG || reduce){ scope.querySelectorAll('.rv').forEach(e=>{ e.style.opacity=1; e.style.transform='none'; }); return; }
    scope.querySelectorAll('[data-split]:not(.done)').forEach(el => { el.classList.add('done'); splitWords(el);
      gsap.from(el.querySelectorAll('.wi'), { yPercent:115, rotate:3, duration:1, ease:'power4.out', stagger:.045, scrollTrigger:{ trigger:el, start:'top 90%', once:true } }); });
    scope.querySelectorAll('.rv:not(.done)').forEach(el => { el.classList.add('done');
      gsap.to(el, { opacity:1, y:0, duration:1, ease:'expo.out', delay:+(el.dataset.d||0), scrollTrigger:{ trigger:el, start:'top 92%', once:true } }); });
  };
  let rf; C.refresh = () => { clearTimeout(rf); rf = setTimeout(() => hasG && ScrollTrigger.refresh(), 150); };
  addEventListener('load', C.refresh);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(C.refresh);
})();

</script>
