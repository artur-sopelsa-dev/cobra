<section class="sec t-ink so-more" data-bg="ink" data-tone="ink">
  <div class="head"><h2 class="display">Outras <span class="it">soluções</span></h2><a class="btn ghost" href="solucoes-em-marketing-digital/">Ver todas <span class="arr">→</span></a></div>
  <div class="so-rail">{{#each content.solucoes as x}}{{#if x.slug != item.slug}}<a class="so-card" href="{{ x.url }}"><div class="in"><img{{#if x.zoom}} class="zoom"{{else}}{{#if x.tall}} class="tall"{{/if}}{{/if}} src="{{ x.img }}" alt="" loading="lazy"><span class="ty">{{ x.tag }}</span><span class="lab">{{ x.nome }}</span></div></a>{{/if}}{{/each}}</div>
</section>
