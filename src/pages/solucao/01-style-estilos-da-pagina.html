<style>
:root{
  color-scheme:dark;
  --ink:#0A0B08;--char:#1B1E15;--paper:#EEF0E3;--paper-2:#E2E5D6;--lime:#CBE22E;--lime-deep:#A9BD1C;--mute:#8C9080;
  --line:rgba(238,240,227,.14);--line-d:rgba(10,11,8,.14);
  --font:"Montserrat","Helvetica Neue",Arial,sans-serif;--graf:"Sedgwick Ave Display",var(--font);
  --gut:clamp(16px,3vw,40px);--ease:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{padding-inline:var(--gut)}
.display{font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.9;margin:0}
.it{font-style:italic;font-weight:300;text-transform:none;letter-spacing:-.035em}
.graf{font-family:var(--graf);font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--lime)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;margin:0}
.eyebrow b,.lime{color:var(--lime)}
.muted{color:var(--mute)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
.sec{position:relative}
.t-ink{background:var(--ink);color:var(--paper)}.t-char{background:var(--char);color:var(--paper)}.t-paper{background:var(--paper);color:var(--ink)}.t-lime{background:var(--lime);color:var(--ink)}
html.js .sec.t-ink,html.js .sec.t-char,html.js .sec.t-paper{background:transparent}
html.js .sec.t-paper{color:var(--ink)}
/* botões */
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;transition:transform .35s var(--ease),background .3s,color .3s;white-space:nowrap}
.btn:hover{background:#d9ef3c}
.btn .arr{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px) rotate(-45deg)}
.btn.ink{background:var(--ink);color:var(--lime)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.ghost:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px var(--gut);pointer-events:none;--hc:var(--paper);transition:transform .5s var(--ease)}
.hdr>*{pointer-events:auto}
.hdr.hide{transform:translateY(-110%)}
.hdr[data-tone="paper"],.hdr[data-tone="lime"]{--hc:var(--ink)}
.logo{display:block;width:108px;color:var(--hc);transition:color .4s;text-decoration:none}
.logo svg{width:100%;display:block;overflow:visible}
.hdr nav{display:flex;gap:4px;padding:5px;border-radius:12px;background:rgba(10,11,8,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(238,240,227,.1)}
.hdr nav a{text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);padding:9px 12px;border-radius:8px;transition:background .3s,color .3s}
.hdr nav a:hover{background:rgba(238,240,227,.1)}
.hdr nav a.on{background:var(--lime);color:var(--ink)}
.burger{display:none;width:48px;height:48px;border-radius:10px;border:1.5px solid var(--hc);background:transparent;cursor:pointer;place-items:center}
.burger i{display:block;width:18px;height:1.5px;background:var(--hc);position:relative}
.burger i::before,.burger i::after{content:"";position:absolute;right:0;height:1.5px;background:var(--hc);transition:transform .4s var(--ease),width .3s}
.burger i::before{top:-5px;width:10px}.burger i::after{top:5px;width:14px}
.menu-open .burger i{background:transparent}.menu-open .burger i::before{width:18px;transform:translateY(5px) rotate(45deg)}.menu-open .burger i::after{width:18px;transform:translateY(-5px) rotate(-45deg)}
.mnav{position:fixed;inset:0;z-index:45;background:var(--char);padding:100px var(--gut) 40px;display:flex;flex-direction:column;justify-content:center;gap:6px;clip-path:inset(0 0 100% 0);transition:clip-path .7s var(--ease);visibility:hidden}
.menu-open .mnav{clip-path:inset(0);visibility:visible}
.menu-open .hdr{--hc:var(--paper)}
.mnav a{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(34px,9vw,60px);line-height:1.02;text-decoration:none;color:var(--paper)}
.mnav a.on{color:var(--lime)}
@media (max-width:1060px){.hdr nav{display:none}.burger{display:grid}.hdr .btn .lbl{display:none}}
/* whatsapp flutuante */
.wa{position:fixed;right:18px;bottom:18px;z-index:40;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.wa:hover{transform:scale(1.08)}
.wa svg{width:26px;height:26px}
/* revelações */
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.wi{display:inline-block}
.rv{opacity:0;transform:translateY(40px)}
html:not(.js) .rv,.reduce .rv{opacity:1;transform:none}
/* rodapé */
.foot{background:var(--ink);color:var(--paper);padding:clamp(70px,10vw,130px) var(--gut) 24px;overflow:hidden}
.f-cta{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:end;padding-bottom:clamp(50px,8vw,100px);border-bottom:1px solid var(--line)}
.f-cta h2{font-size:clamp(44px,7vw,120px)}
.f-cta h2 .it{color:var(--lime);display:block}
.f-cta .side{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.f-cta .side p{margin:0;opacity:.75;max-width:36ch}
.f-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:30px;padding:40px 0}
.f-grid h4{margin:0 0 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.f-grid nav{display:flex;flex-direction:column;gap:8px}
.f-grid a{text-decoration:none;font-weight:600}
.f-grid a:hover{color:var(--lime)}
.f-grid address{font-style:normal;opacity:.8;font-size:14px;line-height:1.7}
.rating{display:flex;align-items:center;gap:12px}.rating strong{font-size:44px;font-weight:800;letter-spacing:-.05em;color:var(--lime);line-height:1}.rating span{display:block;font-size:12px}
.f-big{font-weight:800;text-transform:uppercase;letter-spacing:-.07em;line-height:.75;font-size:clamp(90px,26vw,460px);color:transparent;-webkit-text-stroke:1px rgba(238,240,227,.18);text-align:center;margin:10px 0 20px;white-space:nowrap}
.f-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.f-bottom a{text-decoration:none}
@media (max-width:900px){.f-cta{grid-template-columns:1fr}.f-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.f-grid{grid-template-columns:1fr}}
.proto{position:fixed;left:10px;bottom:10px;z-index:30;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.75);color:var(--mute);padding:5px 8px;border-radius:5px;pointer-events:none}
/* transição de página */
.pgwipe{position:fixed;inset:0;z-index:90;background:var(--lime);transform:translateY(100%);pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* hero */
.so-hero{min-height:100svh;padding:clamp(110px,15vh,150px) var(--gut) clamp(50px,8vh,90px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:clamp(24px,4vw,70px);align-items:center;overflow:hidden}
.so-crumb{grid-column:1/-1;align-self:start;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.so-crumb a{text-decoration:none;opacity:.6}.so-crumb a:hover{opacity:1}
.so-title{margin:0;position:relative;line-height:.8}
.so-script{display:block;font-family:var(--graf);color:var(--lime-deep);font-size:clamp(46px,7vw,120px);line-height:.9;transform:rotate(-4deg);transform-origin:0 100%;margin:0 0 -.12em .04em;position:relative;z-index:2;text-shadow:0 2px 0 rgba(10,11,8,.08)}
.so-big{display:block;font-weight:800;text-transform:uppercase;letter-spacing:-.055em;line-height:.82;white-space:nowrap;font-size:clamp(64px,13vw,210px)}
.so-main{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-content:center;min-width:0}
.so-vis{position:relative;aspect-ratio:1/1.08;max-width:min(420px,58vh);width:100%;justify-self:end}
.so-frame{--notch:polygon(0 0,100% 0,100% 100%,44% 100%,36% calc(100% - 38px),0 calc(100% - 38px));position:absolute;inset:0;background:var(--ink);padding:1px;clip-path:var(--notch);transform:rotate(3deg);transition:transform .8s var(--ease)}
.so-frame:hover{transform:rotate(0)}
.so-frame .in{position:absolute;inset:1px;clip-path:var(--notch);background:#101109;overflow:hidden}
.so-frame img{position:absolute;inset:0 0 38px 0;width:100%;height:calc(100% - 38px);object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s,transform 1s var(--ease)}
.so-frame:hover img{filter:none;transform:scale(1.05)}
.so-frame img.tall{transform:scale(1.8)}.so-frame:hover img.tall{transform:scale(1.85)}
.so-frame img.zoom{transform:scale(1.42)}
.so-frame .lab{position:absolute;right:12px;bottom:0;height:38px;display:flex;align-items:center;font-weight:800;font-size:13px;color:var(--paper)}
.so-frame .ty{position:absolute;left:12px;top:12px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.72);color:var(--paper);padding:6px 9px;border-radius:99px;z-index:2}
.so-lead{margin:0;font-size:clamp(17px,1.4vw,21px);line-height:1.45;max-width:46ch}
.so-row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:900px){.so-hero{grid-template-columns:1fr;grid-template-rows:auto;align-items:start}.so-vis{justify-self:start;max-width:320px}}
/* entregas */
.so-del{padding:clamp(90px,11vw,160px) var(--gut)}
.so-del .head{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut);align-items:end;margin-bottom:40px}
.so-del h2{font-size:clamp(40px,5.6vw,92px)}.so-del h2 .it{color:var(--lime)}
.so-del .head p{margin:0;max-width:42ch;justify-self:end;color:var(--mute)}
.so-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.so-list li{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:clamp(16px,2vw,26px) 0;border-bottom:1px solid var(--line);font-size:clamp(22px,3vw,48px);font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:1;transition:color .3s,padding .5s var(--ease)}
.so-list li i{font-style:normal;font-size:.6em;color:var(--lime);opacity:0;transform:translateX(-10px);transition:all .4s var(--ease)}
.so-list li:hover{color:var(--lime);padding-left:14px}.so-list li:hover i{opacity:1;transform:none}
@media (max-width:760px){.so-del .head{grid-template-columns:1fr}.so-del .head p{justify-self:start}}
/* processo */
.so-proc{padding:clamp(90px,11vw,160px) var(--gut)}
.so-proc h2{font-size:clamp(40px,5.6vw,92px);margin-bottom:44px}.so-proc h2 .it{color:var(--lime)}
.so-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.so-step{border:1px solid var(--line);border-radius:14px;padding:26px 22px 30px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(10,11,8,.25);transition:background .4s,border-color .4s}
.so-step:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.so-step b{font-size:clamp(22px,2vw,30px);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:1}
.so-step p{margin:18px 0 0;font-size:15px;opacity:.8}
.so-step .ic{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:14px;margin-bottom:26px}
@media (max-width:1000px){.so-steps{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.so-steps{grid-template-columns:1fr}.so-step{min-height:0}}
/* marcas (mesmo visual da página Audiovisual) */
.brands{padding-block:clamp(90px,11vw,160px)}
.b-head{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut);align-items:end;margin-bottom:48px}
.b-head h2{margin:0;font-size:clamp(38px,5vw,80px)}
.b-head h2 .it{display:block}
.b-head p{margin:0;max-width:40ch;color:#3b3e33;justify-self:end}
.logos{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(10,11,8,.15);border-left:1px solid rgba(10,11,8,.15)}
.lg{position:relative;aspect-ratio:16/10;display:grid;place-items:center;width:100%;padding:0;background:transparent;border-top:0;border-left:0;cursor:pointer;color:var(--ink);font:inherit;border-right:1px solid rgba(10,11,8,.15);border-bottom:1px solid rgba(10,11,8,.15);overflow:hidden;isolation:isolate;text-decoration:none}
.lg::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .55s var(--ease);z-index:-1}
.lg img{max-width:52%;max-height:42%;object-fit:contain;transition:filter .4s,transform .55s var(--ease);filter:grayscale(1) contrast(1.1)}
.lg.w img{filter:invert(1) grayscale(1)}
.lg span{position:absolute;left:14px;bottom:10px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);opacity:0;transform:translateY(8px);transition:all .4s var(--ease)}
.lg:hover::before{transform:none}
.lg:hover img{filter:grayscale(1) invert(1) brightness(1.4);transform:scale(1.06)}
.lg.w:hover img{filter:none}
.lg:hover span,.lg:focus-visible span{opacity:1;transform:none}
.lg.txt b{font-size:clamp(15px,1.5vw,22px);font-weight:800;letter-spacing:-.02em;text-transform:uppercase;text-align:center;padding:0 14px;line-height:1.05;transition:color .4s}
.lg.txt:hover b{color:var(--paper)}
.lg .cnt{position:absolute;right:10px;top:9px;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6d7064;transition:color .4s}
.lg:hover .cnt{color:var(--lime)}
@media (max-width:760px){.logos{grid-template-columns:repeat(2,1fr)}.b-head{grid-template-columns:1fr}.b-head p{justify-self:start}}
/* outras soluções */
.so-more{padding:clamp(90px,11vw,150px) 0 clamp(90px,11vw,150px) var(--gut)}
.so-more .head{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-right:var(--gut);margin-bottom:34px;flex-wrap:wrap}
.so-more h2{font-size:clamp(36px,4.6vw,76px)}.so-more h2 .it{color:var(--lime)}
.so-rail{display:flex;gap:18px;overflow-x:auto;padding:4px var(--gut) 20px 0;scroll-snap-type:x mandatory;scrollbar-width:thin}
.so-card{--notch:polygon(0 0,100% 0,100% 100%,44% 100%,36% calc(100% - 38px),0 calc(100% - 38px));flex:0 0 clamp(210px,22vw,300px);scroll-snap-align:start;background:rgba(238,240,227,.18);padding:1px;clip-path:var(--notch);text-decoration:none;display:block;transition:background .35s}
.so-card:hover{background:var(--lime)}
.so-card .in{clip-path:var(--notch);background:#101109;aspect-ratio:1/1.08;position:relative;overflow:hidden}
.so-card img{position:absolute;inset:0 0 38px 0;width:100%;height:calc(100% - 38px);object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(.8);transition:filter .6s,transform .9s var(--ease)}
.so-card img.tall{transform:scale(1.8)}.so-card img.zoom{transform:scale(1.42)}
.so-card:hover img{filter:none}
.so-card .in::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;background:#101109;z-index:1}
.so-card .ty{position:absolute;left:12px;top:12px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.72);color:var(--paper);padding:6px 9px;border-radius:99px;z-index:2}
.so-card .lab{position:absolute;right:12px;top:calc(100% - 38px);height:38px;max-width:56%;display:flex;align-items:center;justify-content:flex-end;text-align:right;font-weight:800;font-size:13px;line-height:1.05;color:var(--paper);z-index:2}
.so-card[aria-current] {background:var(--lime)}
