<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
{"@type":"Service","name":{{{ item.nome | json }}},"description":{{{ item.desc | json }}},"url":"{{ site.dominio }}/{{ item.url }}","serviceType":{{{ item.nome | json }}},"areaServed":"BR","provider":{"@type":"Organization","name":"Agência Cobra","url":"{{ site.dominio }}/"}},
{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Início","item":"{{ site.dominio }}/"},{"@type":"ListItem","position":2,"name":"Soluções","item":"{{ site.dominio }}/solucoes-em-marketing-digital/"},{"@type":"ListItem","position":3,"name":{{{ item.nome | json }}},"item":"{{ site.dominio }}/{{ item.url }}"}]}{{#if item.faq}},
{"@type":"FAQPage","mainEntity":[{{#each item.faq as q}}{"@type":"Question","name":{{{ q.pergunta | json }}},"acceptedAnswer":{"@type":"Answer","text":{{{ q.resposta | join | json }}}}}{{#if not @last}},{{/if}}{{/each}}]}{{/if}}
]}
</script>
<script>
document.querySelectorAll('.hf [data-sol="{{ item.slug }}"]').forEach(a=>a.setAttribute('aria-current','page'));
</script>
{{> solucoes-script }}
