<script>
(function(){
  const C = window.__cobra || {}; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; const hasG = !!window.gsap;
  C.reveal && C.reveal();
  /* curvas animadas atrás da mão */
  const cv = document.getElementById('abCv'), t0 = performance.now();
  (function loop(t){ const F = C.fit && C.fit(cv, 1.5); if (F){ F.ctx.clearRect(0,0,F.w,F.h); C.contour(F.ctx,F.w,F.h,{cell:12,scale:90,levels:[-1.6,-.8,0,.8,1.6],lw:1.4,line:'rgba(203,226,46,.35)',ox:0,oy:0},reduce?0:(t-t0)*.0004); }
    if (!reduce) setTimeout(()=>requestAnimationFrame(loop), 50); })(t0);
  /* manifesto: palavras acendem com o scroll */
  const man = document.getElementById('abMan');
  if (man && hasG && !reduce){
    (function wrap(node){ [...node.childNodes].forEach(n=>{ if (n.nodeType===3){ const f=document.createDocumentFragment(); n.textContent.split(/(\s+)/).forEach(p=>{ if(!p) return; if(/^\s+$/.test(p)) f.appendChild(document.createTextNode(p)); else { const s=document.createElement('span'); s.className='w'; s.textContent=p; f.appendChild(s);} }); n.replaceWith(f);} else if (n.nodeType===1) wrap(n); }); })(man);
    const ws=[...man.querySelectorAll('.w')];
    ScrollTrigger.create({ trigger:man, start:'top 80%', end:'bottom 45%', scrub:true, onUpdate:s=>{ const n=Math.round(s.progress*ws.length); ws.forEach((w,i)=>w.classList.toggle('on', i<n)); } });
  } else if (man) man.querySelectorAll('.w').forEach(w=>w.classList.add('on'));
  /* contadores */
  if (hasG && !reduce) document.querySelectorAll('[data-count]').forEach(el=>{ const v=parseFloat(el.dataset.count), dec=el.dataset.count.includes('.')?1:0, o={v:0};
    gsap.to(o,{ v, duration:1.6, ease:'power2.out', scrollTrigger:{ trigger:el, start:'top 88%', once:true }, onUpdate:()=>el.textContent=o.v.toFixed(dec) }); });
  /* imagem que segue o mouse nos serviços */
  const peek=document.getElementById('peek'), pimg=peek.querySelector('img');
  if (matchMedia('(hover:hover)').matches){ let x=0,y=0,px=0,py=0;
    document.getElementById('svcs').addEventListener('pointermove', e=>{ x=e.clientX; y=e.clientY; });
    document.querySelectorAll('.svc').forEach(a=>{ a.addEventListener('pointerenter', ()=>{ pimg.src=a.dataset.img; peek.classList.add('on'); }); a.addEventListener('pointerleave', ()=>peek.classList.remove('on')); });
    (function f(){ px+=(x-px)*.15; py+=(y-py)*.15; peek.style.left=px+'px'; peek.style.top=py+'px'; requestAnimationFrame(f); })(); }
  /* curvas nos cards (valores e equipe) + mapa */
  function still(cv, o){ const F=C.fit(cv,1.5); if (!F) return; F.ctx.clearRect(0,0,F.w,F.h); C.contour(F.ctx,F.w,F.h,o,o.t||0); }
  const draw=()=>{
    document.querySelectorAll('[data-val]').forEach((c,i)=>still(c,{cell:9,scale:60,levels:[-1,0,1],lw:1,line:i===1?'rgba(10,11,8,.25)':'rgba(203,226,46,.28)',ox:i*300,oy:i*120,t:i*3}));
    document.querySelectorAll('.mb .ph canvas').forEach((c,i)=>still(c,{cell:10,scale:55,levels:[-1.2,0,1.2],lw:1,line:'rgba(203,226,46,.14)',ox:i*210,oy:i*90,t:i*2}));
    const m=document.getElementById('mapCv'); if (m) still(m,{cell:8,scale:70,levels:[-2,-1.5,-1,-.5,0,.5,1,1.5,2],lw:1,line:'rgba(203,226,46,.3)',ox:400,oy:200,t:1.3});
  };
  draw(); addEventListener('resize', ()=>{ clearTimeout(draw._t); draw._t=setTimeout(draw,200); });
})();
</script>
