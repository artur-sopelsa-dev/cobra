<style>
:root{
  color-scheme:dark;
  --ink:#0A0B08;--char:#1B1E15;--paper:#EEF0E3;--paper-2:#E2E5D6;--lime:#CBE22E;--lime-deep:#A9BD1C;--mute:#8C9080;
  --line:rgba(238,240,227,.14);--line-d:rgba(10,11,8,.14);
  --font:"Montserrat","Helvetica Neue",Arial,sans-serif;--graf:"Sedgwick Ave Display",var(--font);
  --gut:clamp(16px,3vw,40px);--ease:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{padding-inline:var(--gut)}
.display{font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.9;margin:0}
.it{font-style:italic;font-weight:300;text-transform:none;letter-spacing:-.035em}
.graf{font-family:var(--graf);font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--lime)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;margin:0}
.eyebrow b,.lime{color:var(--lime)}
.muted{color:var(--mute)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
.sec{position:relative}
.t-ink{background:var(--ink);color:var(--paper)}.t-char{background:var(--char);color:var(--paper)}.t-paper{background:var(--paper);color:var(--ink)}.t-lime{background:var(--lime);color:var(--ink)}
html.js .sec.t-ink,html.js .sec.t-char,html.js .sec.t-paper{background:transparent}
html.js .sec.t-paper{color:var(--ink)}
/* botões */
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;transition:transform .35s var(--ease),background .3s,color .3s;white-space:nowrap}
.btn:hover{background:#d9ef3c}
.btn .arr{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px) rotate(-45deg)}
.btn.ink{background:var(--ink);color:var(--lime)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.ghost:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px var(--gut);pointer-events:none;--hc:var(--paper);transition:transform .5s var(--ease)}
.hdr>*{pointer-events:auto}
.hdr.hide{transform:translateY(-110%)}
.hdr[data-tone="paper"],.hdr[data-tone="lime"]{--hc:var(--ink)}
.logo{display:block;width:108px;color:var(--hc);transition:color .4s;text-decoration:none}
.logo svg{width:100%;display:block;overflow:visible}
.hdr nav{display:flex;gap:4px;padding:5px;border-radius:12px;background:rgba(10,11,8,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(238,240,227,.1)}
.hdr nav a{text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);padding:9px 12px;border-radius:8px;transition:background .3s,color .3s}
.hdr nav a:hover{background:rgba(238,240,227,.1)}
.hdr nav a.on{background:var(--lime);color:var(--ink)}
.burger{display:none;width:48px;height:48px;border-radius:10px;border:1.5px solid var(--hc);background:transparent;cursor:pointer;place-items:center}
.burger i{display:block;width:18px;height:1.5px;background:var(--hc);position:relative}
.burger i::before,.burger i::after{content:"";position:absolute;right:0;height:1.5px;background:var(--hc);transition:transform .4s var(--ease),width .3s}
.burger i::before{top:-5px;width:10px}.burger i::after{top:5px;width:14px}
.menu-open .burger i{background:transparent}.menu-open .burger i::before{width:18px;transform:translateY(5px) rotate(45deg)}.menu-open .burger i::after{width:18px;transform:translateY(-5px) rotate(-45deg)}
.mnav{position:fixed;inset:0;z-index:45;background:var(--char);padding:100px var(--gut) 40px;display:flex;flex-direction:column;justify-content:center;gap:6px;clip-path:inset(0 0 100% 0);transition:clip-path .7s var(--ease);visibility:hidden}
.menu-open .mnav{clip-path:inset(0);visibility:visible}
.menu-open .hdr{--hc:var(--paper)}
.mnav a{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(34px,9vw,60px);line-height:1.02;text-decoration:none;color:var(--paper)}
.mnav a.on{color:var(--lime)}
@media (max-width:1060px){.hdr nav{display:none}.burger{display:grid}.hdr .btn .lbl{display:none}}
/* whatsapp flutuante */
.wa{position:fixed;right:18px;bottom:18px;z-index:40;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.wa:hover{transform:scale(1.08)}
.wa svg{width:26px;height:26px}
/* revelações */
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.wi{display:inline-block}
.rv{opacity:0;transform:translateY(40px)}
html:not(.js) .rv,.reduce .rv{opacity:1;transform:none}
/* rodapé */
.foot{background:var(--ink);color:var(--paper);padding:clamp(70px,10vw,130px) var(--gut) 24px;overflow:hidden}
.f-cta{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:end;padding-bottom:clamp(50px,8vw,100px);border-bottom:1px solid var(--line)}
.f-cta h2{font-size:clamp(44px,7vw,120px)}
.f-cta h2 .it{color:var(--lime);display:block}
.f-cta .side{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.f-cta .side p{margin:0;opacity:.75;max-width:36ch}
.f-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:30px;padding:40px 0}
.f-grid h4{margin:0 0 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.f-grid nav{display:flex;flex-direction:column;gap:8px}
.f-grid a{text-decoration:none;font-weight:600}
.f-grid a:hover{color:var(--lime)}
.f-grid address{font-style:normal;opacity:.8;font-size:14px;line-height:1.7}
.rating{display:flex;align-items:center;gap:12px}.rating strong{font-size:44px;font-weight:800;letter-spacing:-.05em;color:var(--lime);line-height:1}.rating span{display:block;font-size:12px}
.f-big{font-weight:800;text-transform:uppercase;letter-spacing:-.07em;line-height:.75;font-size:clamp(90px,26vw,460px);color:transparent;-webkit-text-stroke:1px rgba(238,240,227,.18);text-align:center;margin:10px 0 20px;white-space:nowrap}
.f-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.f-bottom a{text-decoration:none}
@media (max-width:900px){.f-cta{grid-template-columns:1fr}.f-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.f-grid{grid-template-columns:1fr}}
.proto{position:fixed;left:10px;bottom:10px;z-index:30;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.75);color:var(--mute);padding:5px 8px;border-radius:5px;pointer-events:none}
/* transição de página */
.pgwipe{position:fixed;inset:0;z-index:90;background:var(--lime);transform:translateY(100%);pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.ab-hero{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:end;gap:20px;padding:clamp(110px,16vh,150px) var(--gut) clamp(30px,6vh,60px);overflow:hidden}
.ab-hero h1{font-size:clamp(64px,11.5vw,210px);line-height:.82;position:relative;z-index:2}
.ab-hero h1 .l{display:block}
.ab-hero h1 .sig{display:block;width:min(78vw,3.4em);margin:.02em 0 -.1em -.04em}
.ab-hero h1 .sig svg{width:100%;overflow:visible;display:block;filter:drop-shadow(0 10px 30px rgba(203,226,46,.2))}
.ab-hero h1 .sig path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .5s cubic-bezier(.5,0,.3,1) forwards}
.ab-hero h1 .sig path+path{animation-delay:1.5s;animation-duration:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.ab-hero .sub{max-width:520px;font-size:clamp(17px,1.5vw,22px);line-height:1.4;margin:28px 0 26px;opacity:.85}
.ab-hero .row{display:flex;gap:10px;flex-wrap:wrap}
.ab-vis{position:relative;align-self:stretch;min-height:420px}
.ab-vis canvas{position:absolute;inset:-10% -20% -10% -10%;width:130%;height:120%}
.ab-vis img{position:absolute;right:-6%;bottom:-8%;width:min(115%,720px);filter:drop-shadow(0 30px 80px rgba(203,226,46,.18));z-index:1}
.ab-hero .tag{position:absolute;left:var(--gut);top:clamp(96px,14vh,130px)}
.ab-meta{display:flex;gap:26px;flex-wrap:wrap;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:28px;opacity:.7}
@media (max-width:860px){.ab-hero{grid-template-columns:1fr;align-items:start;padding-top:120px}.ab-vis{min-height:70vw;order:-1;margin-top:20px}.ab-vis img{right:auto;left:8%;bottom:-4%;width:92%}.ab-hero .tag{position:static;grid-row:1}}
/* manifesto */
.ab-man{padding:clamp(100px,16vw,220px) var(--gut)}
.ab-man p{margin:0 auto;max-width:17ch;text-align:center;font-size:clamp(38px,6.4vw,112px);line-height:.96;font-weight:800;text-transform:uppercase;letter-spacing:-.045em}
.ab-man p .it{color:var(--lime-deep)}
.ab-man .w{opacity:.14;transition:opacity .2s}
.ab-man .w.on{opacity:1}
.ab-man small{display:block;text-align:center;margin-top:34px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
/* números */
.ab-num{padding:clamp(80px,10vw,140px) var(--gut)}
.ab-num .head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:40px;flex-wrap:wrap}
.ab-num h2{font-size:clamp(40px,5.6vw,92px)}
.ab-num h2 .it{color:var(--lime)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.nums>div{padding:26px 22px 10px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.nums>div:last-child{border-right:0}
.nums>div+div{padding-left:22px}
.nums b{font-size:clamp(70px,9vw,160px);font-weight:800;letter-spacing:-.07em;line-height:.8;font-variant-numeric:tabular-nums}
.nums b sup{font-size:.3em;color:var(--lime);letter-spacing:0;vertical-align:top;margin-left:.06em}
.nums span{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.nums em{font-style:normal;font-size:13px;opacity:.6;max-width:26ch}
@media (max-width:860px){.nums{grid-template-columns:1fr 1fr}.nums>div:nth-child(2){border-right:0}.nums>div:nth-child(3){padding-left:0}.nums>div:nth-child(n+3){border-top:1px solid var(--line)}}
/* serviços */
.ab-svc{padding:clamp(80px,10vw,140px) var(--gut)}
.ab-svc h2{font-size:clamp(40px,5.6vw,92px);margin-bottom:34px}
.ab-svc h2 .it{color:var(--lime)}
.svc{display:grid;grid-template-columns:70px minmax(0,1.1fr) minmax(0,1fr) 60px;align-items:center;gap:24px;padding:26px 0;border-top:1px solid var(--line);text-decoration:none;position:relative}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc .n{font-size:13px;font-weight:800;color:var(--lime)}
.svc h3{margin:0;font-size:clamp(28px,3.6vw,58px);font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.95;transition:transform .5s var(--ease),color .3s}
.svc p{margin:0;opacity:.72;font-size:15px}
.svc .go{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:20px;transition:all .4s var(--ease)}
.svc:hover h3{transform:translateX(14px);color:var(--lime)}
.svc:hover .go{background:var(--lime);color:var(--ink);border-color:var(--lime);transform:rotate(-45deg)}
.peek{position:fixed;left:0;top:0;width:260px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;pointer-events:none;z-index:20;opacity:0;transform:translate(-50%,-50%) scale(.8) rotate(-4deg);transition:opacity .3s,transform .5s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
.peek img{width:100%;height:100%;object-fit:cover}
@media (max-width:860px){.svc{grid-template-columns:40px 1fr 44px}.svc p{grid-column:2/4;grid-row:2}.svc .go{grid-column:3;grid-row:1;width:40px;height:40px}.peek{display:none}}
/* valores */
.ab-val{padding:clamp(80px,10vw,140px) var(--gut)}
.ab-val .head{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;margin-bottom:50px}
.ab-val h2{font-size:clamp(40px,5.6vw,92px)}
.ab-val h2 .it{color:var(--lime-deep)}
.ab-val .head p{margin:0;max-width:44ch;opacity:.75}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.val{background:var(--ink);color:var(--paper);border-radius:18px;padding:26px 22px 24px;min-height:320px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .5s var(--ease)}
.val:hover{transform:translateY(-8px) rotate(-1deg)}
.val .ic{font-family:var(--graf);color:var(--lime);font-size:64px;line-height:1}
.val h3{margin:0 0 10px;font-size:22px;letter-spacing:-.03em;line-height:1.05}
.val p{margin:0;font-size:14px;opacity:.72}
.val canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.val>*{position:relative}
.val:nth-child(2){background:var(--lime);color:var(--ink)}.val:nth-child(2) .ic{color:var(--ink)}
@media (max-width:1000px){.vals{grid-template-columns:1fr 1fr}.ab-val .head{grid-template-columns:1fr}}
@media (max-width:560px){.vals{grid-template-columns:1fr}.val{min-height:220px}}
/* equipe */
.ab-team{padding:clamp(80px,10vw,140px) var(--gut)}
.ab-team .head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:40px}
.ab-team h2{font-size:clamp(40px,5.6vw,92px)}
.ab-team h2 .it{color:var(--lime)}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.mb{position:relative}
.mb .ph{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--char);position:relative;transition:transform .6s var(--ease)}
.mb .ph canvas{position:absolute;inset:0;width:100%;height:100%}
.mb .ph .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mb .ph .sil{position:absolute;left:50%;bottom:0;width:62%;transform:translateX(-50%);color:#2c3122;transition:color .4s}
.mb:hover .ph{transform:translateY(-6px)}
.mb:hover .sil{color:#3b4228}
.mb .ph small{position:absolute;left:12px;top:12px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);background:rgba(10,11,8,.6);padding:5px 8px;border-radius:99px}
.mb h3{margin:14px 0 2px;font-size:18px;letter-spacing:-.02em}
.mb p{margin:0;font-size:13px;opacity:.65}
.mb:nth-child(even){margin-top:60px}
.team-note{margin-top:30px;font-size:13px;color:var(--mute)}
@media (max-width:900px){.team{grid-template-columns:1fr 1fr}.mb:nth-child(even){margin-top:36px}}
/* onde estamos */
.ab-loc{padding:clamp(80px,10vw,140px) var(--gut);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(30px,5vw,80px);align-items:center}
.ab-loc h2{font-size:clamp(40px,5.6vw,92px)}
.ab-loc h2 .it{color:var(--lime-deep)}
.ab-loc address{font-style:normal;font-size:clamp(17px,1.4vw,21px);line-height:1.5;margin:24px 0}
.ab-loc .row{display:flex;gap:10px;flex-wrap:wrap}
.map{position:relative;aspect-ratio:1.25;border-radius:22px;overflow:hidden;background:var(--ink)}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:54%;top:46%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:6px}
.map .pin b{background:var(--lime);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:99px;white-space:nowrap}
.map .pin i{width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(203,226,46,.6);animation:ping 2s infinite}
@keyframes ping{to{box-shadow:0 0 0 26px rgba(203,226,46,0)}}
.map .lbl{position:absolute;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(238,240,227,.45)}
@media (max-width:860px){.ab-loc{grid-template-columns:1fr}}
