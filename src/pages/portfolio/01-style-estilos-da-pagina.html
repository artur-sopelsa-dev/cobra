<style>
:root{color-scheme:dark;--ink:#0A0B08;--char:#1B1E15;--paper:#EEF0E3;--lime:#CBE22E;--lime-deep:#A9BD1C;--mute:#8C9080;--line:rgba(238,240,227,.14);--font:"Montserrat","Helvetica Neue",Arial,sans-serif;--gut:clamp(16px,3vw,40px);--ease:cubic-bezier(.7,0,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%;display:block}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{padding-inline:var(--gut)}
.display{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.92}
.it{font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.03em}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.lime{color:var(--lime)}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;transition:background .3s}
.btn:hover{background:#d9ef3c}.btn.ghost{background:transparent;color:currentColor;border:1.5px solid currentColor}.btn.ink{background:var(--ink);color:var(--lime)}
.btn .arr{display:inline-block;transition:transform .35s var(--ease)}.btn:hover .arr{transform:translateX(4px) rotate(-45deg)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px var(--gut);pointer-events:none}
.hdr>*{pointer-events:auto}
.logo{text-decoration:none;display:flex;align-items:center;gap:12px;color:var(--paper)}
.logo svg{width:104px;overflow:visible}
.logo small{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border-left:1px solid currentColor;padding-left:12px;opacity:.8}
.hdr nav{display:flex;gap:26px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hdr nav a{text-decoration:none;position:relative}
.hdr nav a::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:var(--lime);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.hdr nav a:hover::after,.hdr nav a.cur::after{transform:scaleX(1);transform-origin:left}
@media (max-width:860px){.hdr nav,.logo small{display:none}.hdr .btn .lbl{display:none}}

/* views */
.view{display:none}.view.on{display:block}

/* HUB */
.hub-hero{padding:clamp(130px,16vh,180px) var(--gut) clamp(40px,5vw,70px);position:relative}
.hub-hero h1{margin:14px 0 0;font-size:clamp(64px,15vw,260px);line-height:.82}
.hub-hero h1 .it{color:var(--lime)}
.hub-intro{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut);margin-top:34px;align-items:end}
.hub-intro p{margin:0;color:#c9ccbd;max-width:46ch;font-size:15px}
.hub-intro .count{justify-self:end;display:flex;gap:30px}
.hub-intro .count div b{display:block;font-size:clamp(34px,4vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1}
.hub-intro .count div span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.svc-list{border-top:1px solid var(--line);margin:0 var(--gut)}
.svc-row{position:relative;display:grid;grid-template-columns:70px minmax(0,1.3fr) minmax(0,1fr) 150px 60px;gap:20px;align-items:center;padding:clamp(22px,3vw,40px) 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--paper);overflow:hidden;isolation:isolate}
.svc-row::before{content:"";position:absolute;inset:0;background:var(--lime);transform:scaleY(0);transform-origin:bottom;transition:transform .55s var(--ease);z-index:-1}
.svc-row:hover::before,.svc-row:focus-visible::before{transform:scaleY(1)}
.svc-row:hover,.svc-row:focus-visible{color:var(--ink)}
.svc-row .n{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--lime);transition:color .3s}
.svc-row:hover .n{color:var(--ink)}
.svc-row h2{margin:0;font-size:clamp(30px,4.6vw,76px);transition:transform .55s var(--ease)}
.svc-row:hover h2{transform:translateX(14px)}
.svc-row p{margin:0;font-size:14px;opacity:.8;max-width:40ch}
.svc-row .c{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;justify-self:end}
.svc-row .go{justify-self:end;width:52px;height:52px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:20px;transition:transform .45s var(--ease),background .3s}
.svc-row:hover .go{transform:rotate(-45deg);background:var(--ink);color:var(--lime);border-color:var(--ink)}
.peek{position:fixed;left:0;top:0;width:clamp(220px,22vw,340px);aspect-ratio:4/5;border-radius:10px;overflow:hidden;pointer-events:none;z-index:40;opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-6deg);transition:opacity .35s,transform .45s var(--ease);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
.peek>*{position:absolute;inset:0}
@media (max-width:860px){.svc-row{grid-template-columns:44px minmax(0,1fr) 44px}.svc-row p,.svc-row .c{display:none}.svc-row .go{width:42px;height:42px}.hub-intro{grid-template-columns:1fr}.hub-intro .count{justify-self:start}.peek{display:none}}
.all{padding:clamp(80px,10vw,140px) var(--gut)}
.all-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.all-head h2{margin:0;font-size:clamp(40px,5.4vw,86px)}
.all-head h2 .it{color:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 15px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--paper);transition:all .3s}
.chip:hover{border-color:var(--lime)}.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.case{position:relative;display:block;border:0;padding:0;background:var(--char);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:var(--paper);aspect-ratio:4/5;isolation:isolate}
.case:nth-child(3n+2){transform:translateY(40px)}
.case .v{position:absolute;inset:0;background:var(--char) var(--contour) center/cover}
.case .v img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),filter .6s;filter:grayscale(.3)}
.case:hover .v img{transform:scale(1.06);filter:none}
.case::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(10,11,8,.92));z-index:1}
.case .b{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;display:flex;flex-direction:column;gap:8px}
.case .b h3{margin:0;font-size:clamp(22px,2.2vw,34px);font-weight:800;letter-spacing:-.03em;text-transform:uppercase;line-height:1}
.case .b small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.case .tags{display:flex;flex-wrap:wrap;gap:6px}
.case .tags span{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(238,240,227,.35);border-radius:999px;padding:4px 8px}
.case.soon .v{opacity:.6}
.case.soon .b h3{color:var(--mute)}
.case.out{display:none}
@media (max-width:900px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}.case:nth-child(3n+2){transform:none}}
@media (max-width:560px){.cases{grid-template-columns:1fr}}

/* SERVICE PAGE */
.s-hero{position:relative;min-height:min(100svh,960px);padding:clamp(130px,16vh,170px) var(--gut) clamp(40px,5vw,70px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr);gap:clamp(24px,4vw,60px);align-items:end;overflow:hidden}
.s-hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.s-hero>*{position:relative;z-index:1}
.crumb{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--lime)}.crumb b{color:var(--lime)}
.s-hero h1{margin:0;font-size:clamp(40px,6.6vw,124px);line-height:.86;overflow-wrap:anywhere}
.s-hero h1 .it{display:block;color:var(--lime)}
.s-hero .lead{margin:26px 0 0;max-width:48ch;color:#c9ccbd;font-size:16px}
.s-hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.motif{justify-self:end;width:min(100%,460px);aspect-ratio:1;border-radius:16px;background:var(--char);border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.motif .big{position:absolute;right:-4%;bottom:-10%;font-size:clamp(160px,22vw,340px);font-weight:900;letter-spacing:-.06em;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(203,226,46,.25)}
.m-bars{display:flex;align-items:flex-end;gap:10px;height:55%;width:64%}
.m-bars i{flex:1;background:var(--lime);border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 2.6s var(--ease) infinite alternate}
.m-bars i:nth-child(2){animation-delay:.2s}.m-bars i:nth-child(3){animation-delay:.4s}.m-bars i:nth-child(4){animation-delay:.6s}.m-bars i:nth-child(5){animation-delay:.8s}
@keyframes grow{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.m-feed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:62%}
.m-feed i{aspect-ratio:1;border-radius:4px;background:var(--lime);opacity:.2;animation:blinkf 3s infinite}
.m-feed i:nth-child(3n+1){animation-delay:.3s}.m-feed i:nth-child(4){animation-delay:.9s}.m-feed i:nth-child(8){animation-delay:1.5s}
@keyframes blinkf{0%,100%{opacity:.18}50%{opacity:.9}}
.m-site{width:70%;aspect-ratio:4/3;border:2px solid var(--lime);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.m-site i{display:block;height:9px;border-radius:5px;background:var(--lime)}
.m-site i:nth-child(1){width:34%}.m-site i:nth-child(2){width:78%;opacity:.5;animation:type 3s steps(12) infinite}
.m-site b{flex:1;border-radius:6px;background:rgba(203,226,46,.15);position:relative;overflow:hidden}
.m-site b::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(203,226,46,.35),transparent);animation:scan 2.4s linear infinite}
@keyframes type{from{width:0}}@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.m-mark{font-size:clamp(120px,14vw,220px);font-weight:900;letter-spacing:-.06em;color:var(--lime);line-height:1;animation:morph 6s ease-in-out infinite alternate}
@keyframes morph{0%{font-style:normal;font-weight:900}50%{font-style:italic;font-weight:300}100%{font-style:normal;font-weight:900}}
@media (max-width:860px){.s-hero h1{font-size:10.5vw}.s-hero{grid-template-columns:1fr;min-height:0}.motif{justify-self:start;width:min(100%,340px)}}
.deliv{padding:clamp(60px,8vw,110px) var(--gut);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:clamp(24px,4vw,60px);border-top:1px solid var(--line)}
.deliv h2{margin:0;font-size:clamp(34px,4vw,64px)}
.deliv h2 .it{color:var(--lime);display:block}
.deliv ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.deliv li{padding:20px 16px 20px 0;border-bottom:1px solid var(--line);font-size:clamp(17px,1.5vw,22px);font-weight:700;letter-spacing:-.02em;display:flex;gap:14px;align-items:baseline}
.deliv li::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--lime);flex:none;transform:translateY(-2px)}
@media (max-width:860px){.deliv{grid-template-columns:1fr}.deliv ul{grid-template-columns:1fr}}
.s-cases{padding:clamp(60px,8vw,110px) var(--gut)}
.s-cases .head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.s-cases h2{margin:0;font-size:clamp(34px,4vw,64px)}
.s-clients{padding:0 var(--gut) clamp(60px,8vw,110px)}
.s-clients h2{margin:0 0 16px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.s-clients .rail{display:flex;gap:10px;flex-wrap:wrap}
.s-clients a{border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.s-clients a:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.next{display:block;margin:0 var(--gut) var(--gut);border-radius:18px;background:var(--lime);color:var(--ink);padding:clamp(34px,5vw,70px);text-decoration:none;border:0;width:calc(100% - var(--gut)*2);text-align:left;cursor:pointer;position:relative;overflow:hidden}
.next small{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.next b{display:block;font-size:clamp(44px,8vw,140px);font-weight:800;text-transform:uppercase;letter-spacing:-.05em;line-height:.9;margin-top:10px;transition:transform .6s var(--ease)}
.next:hover b{transform:translateX(20px)}
.next i{position:absolute;right:clamp(20px,4vw,60px);bottom:clamp(20px,4vw,50px);font-style:normal;font-size:clamp(40px,6vw,90px);transition:transform .6s var(--ease)}
.next:hover i{transform:rotate(-45deg)}

/* case overlay */
.co{position:fixed;inset:0;z-index:80;background:var(--ink);display:grid;grid-template-columns:1.2fr 1fr;visibility:hidden;clip-path:inset(50% 50% 50% 50%)}
.co.open{visibility:visible}
.co-vis{position:relative;overflow:hidden;background:var(--char) var(--contour) center/cover}
.co-vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.co-body{padding:clamp(80px,10vh,110px) var(--gut) 30px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.co-body h3{margin:0;font-size:clamp(38px,4.6vw,76px)}
.co-tags{display:flex;flex-wrap:wrap;gap:8px}
.co-tags span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.co-body p{margin:0;color:#c9ccbd;max-width:48ch}
.co-body .note{font-size:12px;color:var(--mute)}
.co-thumbs{display:flex;gap:8px;flex-wrap:wrap}
.co-thumbs img{height:90px;width:auto;border-radius:6px}
.co-close{position:absolute;right:var(--gut);top:18px;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--paper);background:transparent;font-size:22px;cursor:pointer;z-index:2}
@media (max-width:800px){.co{grid-template-columns:1fr;grid-template-rows:38vh 1fr}}

/* footer */
.foot{border-top:1px solid var(--line);padding:clamp(50px,6vw,80px) var(--gut) 24px}
.f-row{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
.f-row nav{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.f-row nav a{text-decoration:none}.f-row nav a:hover{color:var(--lime)}
.f-big{margin-top:30px;font-size:clamp(70px,17vw,300px);font-weight:900;letter-spacing:-.06em;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(203,226,46,.35);text-transform:uppercase;white-space:nowrap}
.f-bottom{margin-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.wa{position:fixed;right:20px;bottom:20px;z-index:40;width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);text-decoration:none}
.wa svg{width:26px;height:26px}
.proto{position:fixed;left:12px;bottom:12px;z-index:40;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.8);color:var(--mute);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:95;border-radius:50%;mix-blend-mode:difference}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff}
.cur-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid #fff;display:grid;place-items:center;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s}
.cur-ring b{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:0}
.cur-ring.link{width:64px;height:64px;margin:-32px 0 0 -32px}
.cur-ring.label{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--lime);border-color:var(--lime);mix-blend-mode:normal}.cur-ring.label b{opacity:1}
.has-cursor,.has-cursor a,.has-cursor button{cursor:none}
.vt{position:fixed;inset:0;z-index:90;background:var(--lime);transform:translateY(100%);pointer-events:none;display:grid;place-items:center}
.vt b{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.m-bars i,.m-feed i,.m-site i,.m-site b::after,.m-mark{animation:none!important}}
