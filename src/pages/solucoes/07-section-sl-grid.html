<section class="sec t-paper sl-grid-sec" data-bg="paper" data-tone="paper" aria-label="Todas as soluções">
  <div class="sl-grid">{{#each content.solucoes as x}}<a class="sl-item" href="{{ x.url }}"><span class="so-card"><span class="in"><img{{#if x.zoom}} class="zoom"{{else}}{{#if x.tall}} class="tall"{{/if}}{{/if}} src="{{ x.img }}" alt="" loading="lazy"><span class="ty">{{ x.tag }}</span><span class="lab">{{ x.nome }}</span></span></span><h3 class="sr">{{ x.nome }}</h3><span class="sl-card-txt">{{ x.desc }}</span></a>{{/each}}</div>
</section>
