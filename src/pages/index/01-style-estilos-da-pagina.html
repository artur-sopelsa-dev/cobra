<style>
:root{
  color-scheme: dark;
  --ink:#0A0B08; --char:#1B1E15; --paper:#EEF0E3; --paper-2:#E2E5D6;
  --lime:#CBE22E; --lime-deep:#A9BD1C; --mute:#8C9080;
  --line:rgba(238,240,227,.14); --fg:#EEF0E3;
  --font:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --gut:clamp(16px,3vw,40px);
  --ease:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit} img{max-width:100%;display:block} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{padding-inline:var(--gut)}
.display{font-family:var(--font);font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.92}
.it{font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.03em}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.lime{color:var(--lime)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
.sec{position:relative}
.t-ink{background:var(--ink);color:var(--paper)} .t-char{background:var(--char);color:var(--paper)} .t-paper{background:var(--paper);color:var(--ink)}
html.js .sec.t-ink,html.js .sec.t-char,html.js .sec.t-paper{background:transparent}
html.js .sec.hs{color:var(--fg)}
.gridlines{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none;z-index:0}
.gridlines i{border-left:1px solid rgba(10,11,8,.07)}
.gridlines.dk i{border-left-color:rgba(238,240,227,.06)}

/* header */
.hdr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--gut);pointer-events:none;--hc:var(--paper)}
.hdr>*{pointer-events:auto}
.hdr[data-tone="paper"],.hdr[data-tone="lime"]{--hc:var(--ink)}
.logo{text-decoration:none;color:var(--hc);transition:color .4s;display:block;width:110px}
.logo svg{display:block;width:100%;overflow:visible}
.hdr-r{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;transition:transform .3s var(--ease),background .3s}
.btn:hover{transform:translateY(-2px);background:#d9ef3c}
.btn .arr{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px) rotate(-45deg)}
.btn.ink{background:var(--ink);color:var(--lime)}
.btn.ghost{background:transparent;color:currentColor;border:1.5px solid currentColor}
.hdr[data-tone="lime"] .btn{background:var(--ink);color:var(--lime)}
.burger{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--hc);background:transparent;cursor:pointer;display:grid;place-items:center;transition:border-color .4s}
.burger i{display:block;width:18px;height:1.5px;background:var(--hc);position:relative;transition:background .4s}
.burger i::before,.burger i::after{content:"";position:absolute;right:0;height:1.5px;background:var(--hc);transition:transform .4s var(--ease),width .3s}
.burger i::before{top:-5px;width:10px}.burger i::after{top:5px;width:14px}
.burger:hover i::before{width:18px}
.menu-open .burger i{background:transparent}
.menu-open .burger i::before{width:18px;transform:translateY(5px) rotate(45deg)}
.menu-open .burger i::after{width:18px;transform:translateY(-5px) rotate(-45deg)}
@media (max-width:640px){.hdr .btn .lbl-long{display:none}}

/* menu */
.menu{position:fixed;inset:0;z-index:45;background:var(--char);color:var(--paper);display:grid;grid-template-columns:1.1fr 1fr;gap:var(--gut);padding:96px var(--gut) 32px;clip-path:inset(0 0 100% 0);transition:clip-path .8s var(--ease);visibility:hidden}
.menu-open .menu{clip-path:inset(0);visibility:visible}
.menu-open .hdr{--hc:var(--paper)}
.m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.m-tiles>*{aspect-ratio:4/3.4;border-radius:6px;filter:grayscale(1) brightness(.6);transition:filter .5s;background-size:cover;background-position:center}
.m-tiles .on{filter:none}
.m-links{display:flex;flex-direction:column;justify-content:center;gap:4px}
.m-links a{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(32px,4.4vw,66px);line-height:1;text-decoration:none;width:fit-content;position:relative;transition:color .3s}
.m-links a:hover,.m-links a:focus-visible{color:var(--lime)}
.m-links a.cur{color:var(--mute)}
.m-links a.cur::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:5px;background:var(--lime);transform:rotate(-2deg)}
.m-foot{margin-top:28px;display:flex;gap:22px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.m-foot a{text-decoration:none;color:var(--mute)}.m-foot a:hover{color:var(--lime)}
@media (max-width:800px){.menu{grid-template-columns:1fr}.m-tiles{display:none}}

/* placeholders */
.ph{position:relative;overflow:hidden;background:#0c0d09 var(--img) var(--pos,center)/cover no-repeat;isolation:isolate}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(10,11,8,.55));z-index:1}
.ph .ph-l{position:absolute;left:12px;bottom:10px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);z-index:2}
.p1{--img:url("assets/816f70543663.jpg")}.p2{--img:url("assets/bd53f12073a2.jpg");--pos:40% 30%}.p3{--img:url("assets/e8c86fb18710.jpg")}.p4{--img:url("assets/0e3330a95fb6.jpg")}
.p5{--img:url("assets/a761a95cc979.jpg")}.p6{--img:url("assets/84a210205cc9.jpg")}.p7{--img:url("assets/bd53f12073a2.jpg");--pos:70% 80%}.p8{--img:url("assets/e8c86fb18710.jpg");--pos:20% 50%}
.key{background:#050505 url("assets/4f057ed32218.jpg") center/cover no-repeat}

/* ================= HERO ================= */
.hero{height:100svh;min-height:560px;overflow:hidden;background:var(--ink)}
html.js .sec.hero{background:var(--ink)}
.h-mq{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:0;z-index:0;color:var(--paper)}
.mq{width:100%;overflow:hidden}
.mq-track{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq.rev .mq-track{animation-direction:reverse;animation-duration:44s}
.mq-track span{white-space:nowrap;padding-right:.4em}
@keyframes mq{to{transform:translateX(-50%)}}
.h-mq .display{font-size:clamp(56px,9vw,150px)}
.h-mq .it{font-size:clamp(58px,9.4vw,156px);color:var(--lime);font-weight:500}
.h-frame{position:absolute;inset:0;z-index:1;background:var(--paper);color:var(--ink);clip-path:inset(0 0 0 0 round 0px);overflow:hidden}
.h-frame canvas.h-topo{position:absolute;inset:0;width:100%;height:100%}
.soft{position:absolute;background:var(--paper-2);border-radius:58% 42% 55% 45%/48% 60% 40% 52%;filter:blur(1px);animation:drift 18s ease-in-out infinite alternate;z-index:0}
.soft.s1{width:34vw;height:30vw;left:-8vw;top:-6vw}
.soft.s2{width:26vw;height:30vw;left:6vw;bottom:-14vw;animation-duration:22s}
.soft.s3{width:30vw;height:24vw;right:-10vw;top:28%;animation-duration:26s}
@keyframes drift{50%{border-radius:40% 60% 44% 56%/58% 42% 58% 42%;transform:translate(2vw,1vw) rotate(8deg)}100%{border-radius:52% 48% 38% 62%/42% 52% 48% 58%;transform:translate(-1vw,2vw) rotate(-6deg)}}
.stage{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(54vw,82svh,720px);aspect-ratio:700/646;z-index:2;cursor:crosshair}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .glow{position:absolute;left:10%;top:22%;width:40%;height:40%;background:radial-gradient(circle,rgba(203,226,46,.28),transparent 65%);filter:blur(10px);pointer-events:none}
.h-stats{position:absolute;left:var(--gut);top:clamp(110px,18vh,170px);z-index:3;display:flex;flex-direction:column;gap:22px}
.h-stat b{display:block;font-weight:800;font-size:clamp(26px,2.6vw,40px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.h-stat span{font-size:12px;color:#55594b;font-weight:500}
.h-copy{position:absolute;left:var(--gut);bottom:clamp(24px,5vh,48px);z-index:3;max-width:min(430px,36vw)}
.h-copy h1{margin:0 0 12px;font-size:clamp(26px,2.9vw,46px)}
.h-copy h1 mark{background:var(--lime);color:var(--ink);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.h-copy p{margin:0 0 18px;font-size:14px;color:#3b3e33;max-width:40ch}
.h-copy .row{display:flex;gap:10px;flex-wrap:wrap}
.h-right{position:absolute;right:var(--gut);top:clamp(110px,18vh,170px);z-index:3;text-align:right;max-width:240px;font-size:13px;font-weight:600;line-height:1.35}
.case-card{position:absolute;right:var(--gut);bottom:clamp(24px,5vh,48px);z-index:3;width:210px;border:1px solid rgba(10,11,8,.18);border-radius:8px;padding:12px;background:rgba(238,240,227,.7);backdrop-filter:blur(6px);text-decoration:none;color:var(--ink);transition:border-color .3s,transform .3s var(--ease)}
.case-card:hover{border-color:var(--ink);transform:translateY(-3px)}
.case-card .eyebrow{font-size:9px;color:#55594b}
.case-card svg{display:block;width:100%;height:46px;margin:6px 0}
.case-card .cc-path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s 1.6s var(--ease) forwards}
.case-card p{margin:0;font-weight:800;font-size:13px;line-height:1.2}
.case-card small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#55594b}
@keyframes draw{to{stroke-dashoffset:0}}
.hint{position:absolute;left:50%;top:clamp(96px,14vh,130px);transform:translateX(-50%);z-index:3;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#55594b;display:flex;gap:8px;align-items:center}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(169,189,28,.7);animation:ping 1.8s infinite}
@keyframes ping{to{box-shadow:0 0 0 12px rgba(169,189,28,0)}}
.h-sign{position:absolute;left:50%;top:50%;width:min(44vw,520px);transform:translate(-50%,-50%) rotate(-6deg);z-index:4;pointer-events:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.h-sign path{stroke-dasharray:1;stroke-dashoffset:1}
html:not(.js) .h-sign{display:none}
@media (min-width:861px) and (max-height:860px){.h-stats{flex-direction:row;gap:34px}.h-copy h1{font-size:clamp(24px,2.5vw,40px)}}
@media (max-width:860px){
  .stage{width:min(108vw,600px);left:56%}
  .h-right,.case-card,.hint,.h-stats{display:none}
  .h-copy{max-width:none;right:var(--gut);bottom:auto;top:96px}
  .h-copy h1{font-size:clamp(28px,8.4vw,40px)}
  .h-copy p{display:block;font-size:13px;margin-bottom:14px}
  .soft.s1{width:70vw;height:60vw}.soft.s3{display:none}
}

/* ================= MANIFESTO ================= */
.mani{padding-block:clamp(90px,12vw,170px);overflow:hidden}
.seal{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:clamp(40px,6vw,80px)}
.seal-mark{position:relative;width:88px;height:60px}
.seal-mark svg{width:100%}
.seal-mark canvas{position:absolute;left:50%;top:44%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%}
.seal span{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.mani p{font-size:clamp(32px,5.6vw,92px);text-align:center;max-width:14ch;margin:0 auto;text-wrap:balance;position:relative;z-index:2}
.mani .w{display:inline-block}
.mani .it{color:var(--lime);font-size:1.04em}
.float{position:absolute;z-index:1;border-radius:4px;overflow:hidden}
.float.f1{left:var(--gut);top:32%;width:clamp(120px,15vw,230px);aspect-ratio:4/3}
.float.f2{right:var(--gut);top:58%;width:clamp(110px,13vw,200px);aspect-ratio:4/3}
@media (max-width:760px){.float{display:none}}

/* ================= H-GALLERY ================= */
.hs{overflow:hidden}
.hs-pin{height:100svh;display:flex;align-items:center}
.hs-track{display:flex;align-items:center;gap:clamp(40px,6vw,110px);padding-inline:12vw 20vw;width:max-content}
.hs-item{flex:none;display:flex;flex-direction:column;gap:10px}
.hs-item .cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75}
.hs-item .ph,.hs-item .key,.hs-item .hs-img{filter:grayscale(1) brightness(.85);transition:filter .8s var(--ease),transform .8s var(--ease);border-radius:3px}
.hs-item.on .ph,.hs-item.on .key,.hs-item.on .hs-img{filter:none;transform:scale(1.02)}
.hs-item.up{align-self:flex-start;margin-top:12vh}.hs-item.down{align-self:flex-end;margin-bottom:10vh}
.hs-quote{max-width:28ch;font-size:clamp(19px,1.8vw,26px);line-height:1.25;font-weight:500;letter-spacing:-.02em}
.hs-quote b{font-weight:800;color:var(--lime-deep)}
.hs-quote .sig{display:block;width:130px;margin-top:10px;color:var(--lime-deep);overflow:visible}
.hs-quote .sig path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s cubic-bezier(.5,0,.3,1)}
.hs-quote .sig path+path{transition-delay:1.2s;transition-duration:.5s}
.hs-item.on .sig path,html:not(.js) .hs-quote .sig path{stroke-dashoffset:0}
.bit{position:absolute;width:14px;height:10px;background:var(--lime);border-radius:1px}
.stat{border:1.5px solid currentColor;border-radius:8px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.stat b{font-size:44px;line-height:1;font-weight:800}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.3;font-weight:700}
@media (max-width:799px){.hs-pin{height:auto;padding-block:60px;overflow-x:auto;display:block}.hs-track{padding-inline:16px}.hs-item.up,.hs-item.down{align-self:center;margin:0}.hs-item .ph,.hs-item .key{filter:none}.hs-quote .sig path{stroke-dashoffset:0}}

/* ================= DOORS ================= */
.doors{padding-block:clamp(90px,12vw,170px) clamp(60px,8vw,120px);overflow:hidden}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);max-width:1040px;margin:0 auto;position:relative;z-index:2}
.door{display:flex;flex-direction:column;gap:18px}
.door:first-child{align-items:flex-end;text-align:right}
.door h2{margin:0;font-size:clamp(34px,5vw,76px)}
.door h2 .it{display:block;font-size:.72em;text-transform:lowercase}
.graf{display:inline-block;font-family:"Sedgwick Ave Display","Permanent Marker",cursive;font-weight:400;text-transform:none;font-size:1.22em;line-height:.9;color:var(--lime);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:rotate(-7deg) translate(.04em,.04em);padding:0 .08em;letter-spacing:.01em}
.door p{margin:0;max-width:34ch;color:#3b3e33}
.door ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.1em}
.door ul li::before{content:"— ";color:var(--lime-deep)}
.sq{width:56px;height:56px;border-radius:10px;background:var(--lime);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:22px;transition:transform .35s var(--ease)}
.sq:hover{transform:rotate(-8deg) scale(1.06)}
.d-side{position:absolute;top:50%;transform:translateY(-50%);z-index:1}
.d-side.l{left:-3vw;width:clamp(90px,11vw,190px)}
.d-side.r{right:-9vw;width:clamp(200px,24vw,380px)}
@media (max-width:760px){.d-grid{grid-template-columns:1fr}.door:first-child{align-items:flex-start;text-align:left}.d-side{display:none}}

/* ================= EXPAND ================= */
.expand{height:100svh;position:relative;overflow:hidden}
.ex-frame{position:absolute;inset:0;clip-path:inset(18% 26% 18% 26% round 18px)}
.ex-frame .key{position:absolute;inset:-6%}
.ex-copy{position:absolute;left:var(--gut);right:var(--gut);bottom:clamp(24px,5vw,60px);z-index:3;color:var(--paper);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.ex-copy h3{margin:0;font-size:clamp(34px,5.4vw,86px);max-width:12ch}
.ex-copy h3 .it{color:var(--lime)}
html:not(.js) .ex-frame{clip-path:none}

/* ================= CHAPTERS ================= */
.chap-pin{min-height:100svh;display:grid;grid-template-columns:1fr minmax(240px,27vw) 1fr;align-items:center;gap:var(--gut);position:relative}
.chap-titles{position:relative;height:1.1em;font-size:clamp(34px,4.4vw,72px)}
.chap-titles h3{position:absolute;left:0;top:0;margin:0;font-size:1em;white-space:nowrap;opacity:0;transform:translateY(40%);transition:opacity .5s,transform .6s var(--ease)}
.chap-titles h3.on{opacity:1;transform:none}
.chap-eyebrow{color:var(--lime);margin-bottom:14px}
.chap-view{height:min(34vw,62svh);overflow:hidden;border-radius:4px;position:relative}
.chap-track{display:flex;flex-direction:column;gap:24px}
.chap-track>*{height:min(34vw,62svh);border-radius:4px;filter:grayscale(1) brightness(.55);transition:filter .6s}
.chap-track>.on{filter:none}
.chap-texts{position:relative;min-height:9em;max-width:36ch}
.chap-texts p{position:absolute;inset:0 0 auto 0;margin:0;color:#c9ccbd;font-size:15px;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .6s var(--ease)}
.chap-texts p.on{opacity:1;transform:none}
.chap-count{position:absolute;right:var(--gut);bottom:28px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chap-count i{width:18px;height:18px;background:linear-gradient(var(--lime),var(--lime)) 0 0/9px 9px no-repeat,linear-gradient(var(--lime),var(--lime)) 9px 9px/9px 9px no-repeat}
.chap-skip{position:absolute;left:50%;bottom:24px;transform:translateX(-50%)}
@media (max-width:860px){
  .chap-pin{grid-template-columns:1fr;min-height:0;padding-block:80px;gap:24px}
  .chap-titles,.chap-texts,.chap-count,.chap-skip{display:none}
  .chap-view{height:auto}.chap-track>*{height:56vw;filter:none}
  .chap-m{display:block!important}
}
.chap-m{display:none}
.chap-m h4{margin:10px 0 4px;font-size:22px}.chap-m p{margin:0 0 6px;color:#c9ccbd;font-size:14px}

/* ================= HALL ================= */
.hs-img{display:block;border-radius:4px;filter:grayscale(.35) contrast(1.05)}
.hall{padding-block:clamp(80px,10vw,140px) clamp(120px,14vw,200px)}
.hall-head{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut);align-items:start;margin-bottom:34px}
.hall-head h2{margin:0;font-size:clamp(40px,6vw,96px)}
.hall-head h2 .it{display:block;color:var(--lime)}
.hall-head p{margin:10px 0 0;color:var(--mute);max-width:40ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 48px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--paper);transition:all .3s}
.chip:hover{border-color:var(--lime)}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid .card:nth-child(4n+2),.grid .card:nth-child(4n+4){margin-top:110px}
.card{--notch:polygon(0 0,100% 0,100% 100%,44% 100%,36% calc(100% - 38px),0 calc(100% - 38px));background:rgba(238,240,227,.18);padding:1px;clip-path:var(--notch);transition:background .35s;text-decoration:none;display:block}
.card-in{clip-path:var(--notch);background:#101109;aspect-ratio:1/1.08;position:relative;overflow:hidden}
.card:hover,.card:focus-visible{background:var(--lime)}
.card .v{position:absolute;inset:0 0 38px 0;display:grid;place-items:center;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.card .v-real{opacity:0;transform:scale(1.08)}
.card:hover .v-real,.card:focus-visible .v-real{opacity:1;transform:none}
.card:hover .v-mock,.card:focus-visible .v-mock{opacity:0;transform:scale(.94)}
.card .v-real>*{position:absolute;inset:10px;border-radius:2px}
.card .lab{position:absolute;right:12px;bottom:10px;display:flex;gap:10px;font-weight:800;font-size:14px}
.card .lab em{font-style:normal;color:var(--lime);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;align-self:center}
.card.out{display:none}
.card-in .cv{position:absolute;inset:0 0 38px 0;width:100%;height:calc(100% - 38px);object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(.8);transform:scale(1.02);transition:filter .6s var(--ease),transform .9s var(--ease)}
.card:hover .cv,.card:focus-visible .cv{filter:none;transform:scale(1.08)}
.card-in .ty{position:absolute;left:12px;top:12px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.72);color:var(--paper);padding:6px 9px;border-radius:99px;backdrop-filter:blur(6px)}
.card-in .go{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);opacity:0;background:var(--lime);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:99px;transition:opacity .35s,transform .45s var(--ease)}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:translate(-50%,-50%) scale(1)}
.grid{align-items:start}
.has-cursor .card-in .go{display:none}
.sol .lab{max-width:54%;text-align:right;line-height:1.05;font-size:13px;bottom:auto;top:calc(100% - 38px);height:38px;align-items:center;justify-content:flex-end;color:var(--fg)}
.sol .sd{position:absolute;left:0;right:0;bottom:38px;padding:40px 14px 14px;font-size:13px;line-height:1.4;color:var(--paper);background:linear-gradient(180deg,transparent,rgba(10,11,8,.92) 38%);opacity:0;transform:translateY(12px);transition:opacity .4s,transform .5s var(--ease);pointer-events:none}
.sol:hover .sd,.sol:focus-visible .sd{opacity:1;transform:none}
.sol .go{top:34%;z-index:3}
.sol .card-in::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;background:#101109;z-index:1}.sol .lab{z-index:2}.sol .sd{z-index:2}
.sol .cv.zoom{transform:scale(1.42)}.sol:hover .cv.zoom{transform:scale(1.5)}.sol .cv.tall{transform:scale(1.8)}.sol:hover .cv.tall{transform:scale(1.9)}
@media (max-width:560px){.sol .sd{display:none}.sol{--notch:polygon(0 0,100% 0,100% 100%,26% 100%,18% calc(100% - 38px),0 calc(100% - 38px))}.sol .lab{max-width:76%;font-size:11.5px;right:10px}}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr!important;gap:12px}.grid .card:nth-child(n){margin-top:0!important}.grid .card:nth-child(2n){margin-top:40px!important}.card-in{aspect-ratio:3/4.2}.card-in .ty{display:none}.card .lab{font-size:12px}.card .lab em{display:none}}
.hall-note{margin-top:28px;color:var(--mute);font-size:13px}
.hall-cta{text-align:center;margin-top:90px}
.hall-cta,.hall-note{color:var(--fg)}
.hall-cta p{font-size:clamp(22px,2.4vw,34px);font-weight:600;letter-spacing:-.02em;margin:0 0 22px;line-height:1.15}
.mk{width:62%;color:var(--lime)}
.mk-site{aspect-ratio:4/3;border:1.5px solid currentColor;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mk-site i{display:block;height:6px;border-radius:3px;background:currentColor;opacity:.5}.mk-site i:first-child{width:30%;opacity:1}.mk-site b{flex:1;border-radius:3px;background:currentColor;opacity:.18}
.mk-feed{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:52%}
.mk-feed i{aspect-ratio:1;background:currentColor;opacity:.25;border-radius:2px}.mk-feed i:nth-child(3n+1){opacity:.8}
.mk-play{aspect-ratio:16/10;border:1.5px solid currentColor;border-radius:6px;display:grid;place-items:center}
.mk-play::after{content:"";border-left:22px solid currentColor;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.mk-bars{display:flex;align-items:flex-end;gap:6px;height:90px;width:56%}.mk-bars i{flex:1;background:currentColor;border-radius:2px 2px 0 0}
.mk-mark{font-size:92px;font-weight:800;line-height:1;text-align:center;width:auto}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.grid .card:nth-child(n){margin-top:0}.grid .card:nth-child(2n){margin-top:70px}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.grid .card:nth-child(n){margin-top:0}.hall-head{grid-template-columns:1fr}}

/* ================= OFFER ================= */
.offer{background:var(--paper);color:var(--ink);border-radius:50% 50% 0 0/90px 90px 0 0;margin-top:-90px;padding-block:clamp(120px,12vw,180px) clamp(80px,10vw,140px);overflow:hidden}

.o-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:var(--gut);align-items:center}
.o-copy .eyebrow{display:block;margin-bottom:18px}
.o-copy h2{margin:0 0 22px;font-size:clamp(34px,4.6vw,72px)}
.ln{position:relative;display:block;width:fit-content}
.ln::after{content:"";position:absolute;inset:-2px -6px;background:var(--lime);transform:scaleX(0);transform-origin:left;pointer-events:none}
.wipe:not(.in) .ln{color:transparent}
.wipe.in .ln{animation:lnshow 1.1s var(--ease) both}.wipe.in .ln:nth-child(2){animation-delay:.12s}.wipe.in .ln:nth-child(3){animation-delay:.24s}
@keyframes lnshow{0%,49%{color:transparent}50%,100%{color:inherit}}
.wipe.in .ln::after{animation:wipe 1.1s var(--ease) both}
.wipe.in .ln:nth-child(2)::after{animation-delay:.12s}.wipe.in .ln:nth-child(3)::after{animation-delay:.24s}
@keyframes wipe{0%{transform:scaleX(0);transform-origin:left}49%{transform:scaleX(1);transform-origin:left}51%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
.o-copy p{max-width:42ch;margin:0 0 28px;color:#3b3e33}
.o-copy .note{font-size:12px;color:#6d7064;margin-top:14px}
.collage{position:relative;height:clamp(420px,46vw,620px)}
.collage>*{position:absolute}
.cl-dash{left:4%;top:8%;width:52%;background:var(--ink);color:var(--paper);border-radius:10px;padding:16px;box-shadow:0 30px 60px rgba(10,11,8,.25)}
.cl-dash .eyebrow{font-size:9px;color:var(--mute)}
.cl-dash b{display:block;font-size:clamp(26px,2.8vw,40px);margin:6px 0;font-weight:800;letter-spacing:-.03em}
.cl-dash svg{width:100%;height:80px}
.cl-phone{right:6%;top:0;width:30%;aspect-ratio:9/18.5;border-radius:26px;background:var(--ink);padding:10px;box-shadow:0 30px 60px rgba(10,11,8,.28)}
.cl-phone .scr{height:100%;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;align-content:start;background:#15170f;padding-top:30px}
.cl-phone .scr>*{aspect-ratio:1}
.cl-site{left:18%;bottom:2%;width:60%;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(10,11,8,.25)}
.cl-site .bar{height:22px;background:#e2e4d7;display:flex;gap:5px;align-items:center;padding-left:8px}
.cl-site .bar i{width:7px;height:7px;border-radius:50%;background:#b9bcad}
.cl-site .key{aspect-ratio:16/8}
.sticker{right:2%;bottom:14%;width:120px;height:120px;border-radius:50%;background:var(--lime);display:grid;place-items:center;text-align:center;font-weight:800;text-transform:uppercase;font-size:13px;line-height:1.05;transform:rotate(-12deg);box-shadow:0 14px 30px rgba(10,11,8,.2)}
@media (max-width:860px){.o-grid{grid-template-columns:1fr}.offer{border-radius:50% 50% 0 0/40px 40px 0 0;margin-top:-40px}}

/* ================= BRANDS (nomes nos dois lados, linha neon no centro) ================= */
.brands{padding-block:clamp(80px,10vw,140px);overflow:clip}
.b-head{text-align:center;position:relative;z-index:2;margin-bottom:40px}
.b-head h2{margin:0;font-size:clamp(40px,5.6vw,90px)}
.b-head h2 .it{display:block;color:var(--lime)}
.b-head p{margin:14px auto 0;max-width:44ch;opacity:.7}
.b-grid{position:relative;display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;gap:var(--gut);min-height:120vh;z-index:2}
.b-col{display:flex;flex-direction:column;gap:clamp(56px,9vh,110px);align-items:center;padding-top:6vh}
.b-col:nth-child(2),.b-col:nth-child(4){padding-top:20vh}
.b-col span{font-weight:800;font-size:clamp(18px,1.9vw,30px);letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;transition:color .35s}
.b-col span:nth-child(2n){font-style:italic;font-weight:400;text-transform:none}
.b-col span.on{color:var(--lime)}
.b-link{color:inherit;text-decoration:none;background:linear-gradient(var(--lime),var(--lime)) 0 100%/0 .32em no-repeat;transition:background-size .45s var(--ease)}
.b-link:hover{background-size:100% .32em}
.b-center{position:relative;align-self:stretch;min-height:100%}
.b-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.b-cta{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap}
.brands .b-cta{background:var(--lime);color:var(--ink)}
@media (max-width:860px){.b-grid{grid-template-columns:1fr 1fr;min-height:0}.b-center{grid-column:1/-1;order:2;min-height:0;display:flex;justify-content:center;margin-top:30px}.b-line{display:none}.b-cta{position:static;transform:none}.b-col{padding-top:0!important;gap:28px}.b-col:nth-child(n+4){display:none}.b-col span:nth-child(n+4){display:none}}

/* ================= FAN ================= */
.fan-sec{padding-block:clamp(60px,8vw,110px);text-align:center;overflow:hidden}
.fan-ico{width:34px;height:34px;border-radius:50%;display:inline-block}
.fan-sec h2{margin:18px 0 0;font-size:clamp(40px,5.4vw,86px)}
.fan-sec h2 .it{display:block}
.fan{position:relative;height:clamp(360px,40vw,520px);margin-top:40px}
.fcard{position:absolute;left:50%;top:0;width:clamp(180px,19vw,270px);aspect-ratio:3/4.3;margin-left:calc(clamp(180px,19vw,270px)/-2);border-radius:28px;overflow:hidden;transform-origin:50% 120%;box-shadow:0 20px 40px rgba(10,11,8,.18);text-decoration:none;color:var(--paper);display:block}

.fcard .fc-t{position:absolute;left:16px;right:16px;bottom:16px;text-align:left;z-index:2;font-weight:700;font-size:16px;line-height:1.2;letter-spacing:-.01em}
.fcard .fc-t small{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}

.soc{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:34px;font-weight:800;text-transform:uppercase;font-size:13px}

.fan-sec .lead{font-size:clamp(20px,2.2vw,30px);font-weight:500;margin:26px 0 0;letter-spacing:-.02em}

/* ================= FOOTER ================= */
.foot{background:var(--lime);padding:0 12px;position:relative;z-index:1}
.f-card{background:var(--char);color:var(--paper);border-radius:0 0 26px 26px;position:relative;overflow:hidden;padding:110px var(--gut) 40px;min-height:min(100svh,880px);display:flex;flex-direction:column}
.f-card #topo2{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.f-sign{width:min(52vw,340px);margin:0 auto -10px;position:relative;z-index:2;display:block}
.f-sign path{stroke-dasharray:1;stroke-dashoffset:0}
.f-title{text-align:center;font-size:clamp(40px,6vw,100px);margin:0;position:relative;z-index:3}
.f-title .it{color:var(--lime)}
.f-mid{flex:1;display:grid;grid-template-columns:1fr minmax(200px,34vw) 1fr;align-items:end;gap:20px;position:relative;z-index:2;margin-top:10px}
.f-col{text-align:center;align-self:center}
.f-col .eyebrow{font-size:9px;color:var(--mute);margin-bottom:10px}
.f-col a{display:block;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(18px,2vw,28px);line-height:1.15;text-decoration:none}
.f-col a:hover{color:var(--lime)}
.f-hand{position:relative;margin-bottom:-40px}
.f-hand img{width:100%;filter:drop-shadow(0 0 60px rgba(203,226,46,.18))}
.f-badges{position:relative;z-index:3;margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.f-badges .mq-track span{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding-right:3em;color:var(--lime)}
.f-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 8px 16px;font-size:11px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.06em}

@media (max-width:760px){.f-mid{grid-template-columns:1fr}.f-hand{order:-1;max-width:320px;margin:0 auto}.f-wa{position:relative;left:auto;bottom:auto;transform:none;margin:24px auto 0}}

/* cursor */
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:95;border-radius:50%;mix-blend-mode:difference}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff}
.cur-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid #fff;display:grid;place-items:center;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s,border-color .3s}
.cur-ring b{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#000;opacity:0;transition:opacity .2s}
.cur-ring.link{width:64px;height:64px;margin:-32px 0 0 -32px}
.cur-ring.view{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--lime);border-color:var(--lime);mix-blend-mode:normal}
.cur-ring.view b{opacity:1;color:var(--ink)}
.cur-ring.snake{width:14px;height:14px;margin:-7px 0 0 -7px;border-color:transparent;background:transparent}
.has-cursor,.has-cursor a,.has-cursor button,.has-cursor .stage{cursor:none}
/* word reveal */
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em;margin-bottom:-.1em}
.wi{display:inline-block;will-change:transform}
/* pixel transition */
.pixels{position:absolute;left:0;right:0;top:0;height:clamp(54px,8vw,120px);display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(3,1fr);z-index:3;pointer-events:none}
.pixels i{background:var(--paper)}
html:not(.js) .pixels{display:none}
@media (max-width:760px){.pixels{grid-template-columns:repeat(8,1fr)}}
/* case overlay */
.case-ov{position:fixed;inset:0;z-index:85;background:var(--ink);color:var(--paper);display:grid;grid-template-columns:1.2fr 1fr;visibility:hidden;clip-path:inset(50% 50% 50% 50%)}
.case-ov.open{visibility:visible}
.co-vis{position:relative;overflow:hidden}
.co-vis>*{position:absolute;inset:0}
.co-body{padding:clamp(80px,10vh,120px) var(--gut) 40px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.co-body h3{margin:0;font-size:clamp(40px,5vw,84px)}
.co-tags{display:flex;flex-wrap:wrap;gap:8px}
.co-tags span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.co-body p{margin:0;color:#c9ccbd;max-width:46ch}
.co-close{position:absolute;right:var(--gut);top:18px;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--paper);background:transparent;color:var(--paper);font-size:22px;cursor:pointer;z-index:2}
@media (max-width:800px){.case-ov{grid-template-columns:1fr;grid-template-rows:42vh 1fr}}
/* gallery big word + chapter bar */
.hs-word{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:24vw;font-weight:900;letter-spacing:-.05em;line-height:.8;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px currentColor;opacity:.12;pointer-events:none;z-index:0;text-transform:uppercase}
.hs-track{position:relative;z-index:1}
.chap-bar{height:2px;background:rgba(238,240,227,.15);margin-top:30px;max-width:320px}
.chap-bar i{display:block;height:100%;background:var(--lime);transform-origin:left;transform:scaleX(0)}
@media (max-width:860px){.chap-bar{display:none}}

/* misc */
.wa{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);text-decoration:none;transition:transform .3s var(--ease)}
.wa:hover{transform:scale(1.08) rotate(-8deg)}
.wa svg{width:26px;height:26px}
.proto{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.8);color:var(--mute);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.loader{position:fixed;inset:0;z-index:100;background:var(--lime);display:grid;place-items:center;animation:up .9s 1.35s var(--ease) forwards}
.loader svg{width:min(60vw,340px)}
.loader path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.05s .05s cubic-bezier(.5,0,.3,1) forwards}
.loader path+path{animation-delay:.8s;animation-duration:.4s}
.loader small{position:absolute;bottom:34px;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
@keyframes up{to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){
  .mq-track,.hint i,.soft{animation:none!important}
  .case-card .cc-path{animation:none;stroke-dashoffset:0}
  .wipe.in .ln::after{animation:none}
  .loader{display:none}
}
