<style>
:root{
  color-scheme: dark;
  --ink:#0A0B08; --char:#1B1E15; --paper:#EEF0E3; --lime:#CBE22E; --lime-deep:#A9BD1C; --mute:#8C9080;
  --line:rgba(238,240,227,.14); --fg:#EEF0E3;
  --font:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --gut:clamp(16px,3vw,40px); --ease:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit} img,video{max-width:100%;display:block} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{padding-inline:var(--gut)}
.display{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.92}
.it{font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.03em}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.lime{color:var(--lime)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
.sec{position:relative}
.t-ink{background:var(--ink);color:var(--paper)}.t-char{background:var(--char);color:var(--paper)}.t-paper{background:var(--paper);color:var(--ink)}.t-lime{background:var(--lime);color:var(--ink)}
html.js .sec.t-ink,html.js .sec.t-char,html.js .sec.t-paper{background:transparent}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;transition:transform .3s var(--ease),background .3s}
.btn:hover{background:#d9ef3c}
.btn.ghost{background:transparent;color:currentColor;border:1.5px solid currentColor}
.btn.ghost:hover{background:rgba(238,240,227,.08)}
.btn .arr{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px) rotate(-45deg)}

/* header */
.hdr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px var(--gut);pointer-events:none;--hc:var(--paper)}
.hdr>*{pointer-events:auto}
.hdr[data-tone="paper"],.hdr[data-tone="lime"]{--hc:var(--ink)}
.logo{text-decoration:none;color:var(--hc);transition:color .4s;display:flex;align-items:center;gap:12px}
.logo svg{width:104px;overflow:visible}
.logo small{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border-left:1px solid currentColor;padding-left:12px;opacity:.8}
.hdr nav{display:flex;gap:26px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hc);transition:color .4s}
.hdr nav a{text-decoration:none;position:relative}
.hdr nav a::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:var(--lime);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.hdr nav a:hover::after{transform:scaleX(1);transform-origin:left}
.hdr[data-tone="lime"] .btn{background:var(--ink);color:var(--lime)}
@media (max-width:860px){.hdr nav,.logo small{display:none}.hdr .btn .lbl{display:none}}

/* ============ HERO ============ */
.hero{height:100svh;min-height:560px;overflow:hidden;background:var(--ink)}
html.js .sec.hero{background:var(--ink)}
.h-mq{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;color:var(--paper);z-index:0}
.mq{width:100%;overflow:hidden}
.mq-track{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq.rev .mq-track{animation-direction:reverse;animation-duration:44s}
.mq-track>*{white-space:nowrap;padding-right:.4em;flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
.h-mq .display{font-size:clamp(56px,9vw,150px)}
.h-mq .it{font-size:clamp(58px,9.4vw,156px);color:var(--lime);font-weight:500}
.h-frame{position:absolute;inset:0;z-index:1;overflow:hidden;background:#000;clip-path:inset(0 0 0 0 round 0px)}
.h-frame video,.h-frame .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.h-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,8,.55) 0%,rgba(10,11,8,.05) 35%,rgba(10,11,8,.25) 60%,rgba(10,11,8,.85) 100%)}
#heroFx{position:absolute;inset:0;width:100%;height:100%}
.vf{position:absolute;inset:clamp(76px,11vh,110px) var(--gut) clamp(24px,5vh,48px);pointer-events:none;z-index:2}
.vf i{position:absolute;width:26px;height:26px;border:2px solid var(--lime)}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.rec{position:absolute;right:calc(var(--gut) + 38px);top:calc(clamp(76px,11vh,110px) + 18px);z-index:3;display:flex;gap:14px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--paper);font-variant-numeric:tabular-nums}
.rec b{display:inline-flex;align-items:center;gap:8px}
.rec b::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.rec span{opacity:.75}
.h-meta{position:absolute;left:calc(var(--gut) + 38px);top:calc(clamp(76px,11vh,110px) + 18px);z-index:3;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--paper);opacity:.8;display:flex;gap:18px}
.h-content{position:absolute;left:calc(var(--gut) + 38px);right:calc(var(--gut) + 38px);bottom:calc(clamp(24px,5vh,48px) + 34px);z-index:3;color:var(--paper);display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.h-content h2{margin:0;font-size:clamp(46px,8.6vw,150px);line-height:.88}
.h-content h2 .l2{display:block}
.h-content h1 [data-prox]{white-space:nowrap}
.h-content h1 .ch{display:inline-block}
.h-content h1 .ch.alt{font-style:italic;font-weight:300;letter-spacing:-.02em}
.h-content h1 .amp{color:var(--lime)}
.h-side{max-width:320px;display:flex;flex-direction:column;gap:18px}
.h-side p{margin:0;font-size:14px;opacity:.85}
.h-side .row{display:flex;gap:10px;flex-wrap:wrap}
.h-sign{position:absolute;left:50%;top:50%;width:min(60vw,700px);transform:translate(-50%,-50%) rotate(-6deg);z-index:4;pointer-events:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.h-sign path{stroke-dasharray:1;stroke-dashoffset:1}
html:not(.js) .h-sign{display:none}
@media (max-width:860px){.h-content h2{font-size:9.6vw}.h-meta{display:none}.rec{right:calc(var(--gut) + 20px)}.h-content{left:calc(var(--gut) + 18px);right:calc(var(--gut) + 18px)}.h-side{max-width:none}}

/* ============ GALLERY ============ */
.gal-sec{padding-top:clamp(90px,11vw,150px)}
.g-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:26px}
.g-head h2{margin:0;font-size:clamp(46px,7vw,112px)}
.g-head h2 .it{display:block;color:var(--lime)}
.g-tools{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 15px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--paper);transition:all .3s}
.chip:hover{border-color:var(--lime)}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.chip sup{font-size:9px;margin-left:4px;opacity:.7}
.g-hint{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center}
.g-hint i{display:inline-block;width:22px;height:22px;border:1.5px solid currentColor;border-radius:50%;position:relative}
.g-hint i::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--lime);transform:translate(-50%,-50%);animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translate(-120%,-50%)}50%{transform:translate(20%,-50%)}}
.gal{position:relative;height:min(100svh,1040px);min-height:620px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;border-block:1px solid var(--line)}
.gal.dragging{cursor:grabbing}
.gal::before,.gal::after{content:"";position:absolute;left:0;right:0;height:90px;z-index:3;pointer-events:none}
.gal::before{top:0;background:linear-gradient(var(--ink),transparent)}.gal::after{bottom:0;background:linear-gradient(transparent,var(--ink))}
.tile{position:absolute;left:0;top:0;padding:0;border:0;background:#151710;border-radius:6px;overflow:hidden;cursor:inherit;will-change:transform;transform-origin:50% 50%;transition:opacity .45s,filter .45s}
.tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;transition:transform .8s var(--ease)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 10px;background:linear-gradient(transparent,rgba(10,11,8,.9));text-align:left;color:var(--paper);transform:translateY(40%);opacity:0;transition:all .45s var(--ease)}
.tile .cap b{display:block;font-size:13px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.tile .cap span{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.tile .kind{position:absolute;left:10px;top:10px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,11,8,.72);color:var(--paper);padding:5px 8px;border-radius:4px;backdrop-filter:blur(4px);display:flex;gap:6px;align-items:center}
.tile .kind::before{content:"";width:0;height:0;border-left:6px solid var(--lime);border-top:4px solid transparent;border-bottom:4px solid transparent}
.tile[data-kind="photo"] .kind::before{border:0;width:6px;height:6px;border-radius:50%;background:var(--lime)}
.tile .ex{position:absolute;right:10px;top:10px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--lime);color:var(--ink);padding:4px 7px;border-radius:4px}
.tile .nothumb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px;text-align:left;background:var(--char) var(--contour) center/cover}
.tile .nothumb b{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--paper);text-transform:uppercase}
.tile .nothumb small{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.gal .tile:hover .cap,.gal .tile:focus-visible .cap{transform:none;opacity:1}
.gal .tile:hover img{transform:scale(1.06)}
.gal.hovering .tile:not(:hover){opacity:.35;filter:grayscale(1)}
.g-count{position:absolute;right:var(--gut);bottom:18px;z-index:4;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.g-count b{color:var(--paper);font-size:22px;letter-spacing:-.02em;margin-right:6px}
@media (max-width:760px){.g-head{grid-template-columns:1fr}.g-tools{align-items:flex-start}.gal{height:88svh;min-height:520px}}

/* screening room */
.sala{padding-block:clamp(90px,11vw,150px)}
.s-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:30px}
.s-head h2{margin:0;font-size:clamp(40px,5.6vw,90px)}
.s-head h2 .it{color:var(--lime)}
.s-theatre{position:relative;display:flex;justify-content:center;align-items:center;padding-block:clamp(10px,2vw,24px);isolation:isolate}
.s-amb{position:absolute;inset:0 -20px;z-index:-1;background-size:cover;background-position:center;filter:blur(60px) brightness(.5) saturate(1.3);opacity:.55;transition:background-image .6s;pointer-events:none}
.s-stage{position:relative;width:640px;height:480px;max-width:100%;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.s-media{position:absolute;inset:0}
.s-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-media .nothumb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:26px;background:var(--char) var(--contour) center/cover}
.s-media .nothumb b{font-size:clamp(24px,2.4vw,40px);font-weight:800;text-transform:uppercase;line-height:1;letter-spacing:-.03em;color:var(--paper)}
.s-media .nothumb small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.s-arrow{position:absolute;top:50%;z-index:3;width:56px;height:56px;margin-top:-28px;border-radius:50%;border:1.5px solid var(--line);background:rgba(10,11,8,.55);backdrop-filter:blur(6px);color:var(--paper);font-size:20px;cursor:pointer;transition:background .3s,color .3s}
.s-arrow:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.s-arrow.prev{left:0}.s-arrow.next{right:0}
.s-top{position:absolute;left:14px;right:14px;top:12px;z-index:3;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 8px rgba(0,0,0,.7)}
.s-top .ex{background:var(--lime);color:var(--ink);padding:4px 7px;border-radius:4px;text-shadow:none}
.s-prog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:rgba(238,240,227,.12)}
.s-prog i{display:block;height:100%;background:var(--lime);transform-origin:left;transform:scaleX(0)}
.s-info{margin-top:clamp(20px,2.6vw,34px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:clamp(16px,3vw,48px);align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
.s-info .k{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:8px}
.s-info h3{margin:0;font-size:clamp(30px,3.4vw,56px);font-weight:800;letter-spacing:-.04em;text-transform:uppercase;line-height:.95}
.s-info .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.s-info .meta span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.s-info p{margin:0;color:#c9ccbd;font-size:14px;max-width:48ch}
.s-info .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.s-pos{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-right:6px}
.s-auto{background:transparent;border:1.5px solid var(--line);border-radius:10px;height:48px;padding:0 14px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--paper)}
.s-auto[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
.s-thumbs{margin-top:22px;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-bottom:12px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--lime) transparent;cursor:grab}
.s-th{position:relative;flex:none;height:clamp(120px,13vw,190px);width:auto;aspect-ratio:var(--ar,1);border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--char) var(--contour) center/cover;opacity:.5;transition:opacity .35s,transform .45s var(--ease);scroll-snap-align:center}
.s-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-th:hover{opacity:.9;transform:translateY(-4px)}
.s-th.on{opacity:1;outline:3px solid var(--lime);outline-offset:-3px;transform:translateY(-6px)}
.s-th .t{position:absolute;left:8px;bottom:7px;right:8px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--paper);text-align:left;text-shadow:0 1px 6px rgba(0,0,0,.9);line-height:1.2}
.s-th .ty{position:absolute;right:6px;top:6px;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(10,11,8,.75);color:var(--lime);padding:3px 5px;border-radius:3px}
@media (max-width:900px){.s-head{grid-template-columns:1fr}.s-info{grid-template-columns:1fr;align-items:start}.s-info .row{justify-content:flex-start}.s-arrow{width:46px;height:46px;margin-top:-23px}.s-th{height:110px}}

/* client page */
.cp{position:fixed;inset:0;z-index:70;background:var(--ink);color:var(--paper);overflow-y:auto;overscroll-behavior:contain;visibility:hidden;clip-path:inset(100% 0 0 0)}
.cp.open{visibility:visible}
.cp-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px var(--gut);background:rgba(10,11,8,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cp-back{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1.5px solid var(--paper);border-radius:10px;height:44px;padding:0 16px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.cp-back:hover{background:var(--paper);color:var(--ink)}
.cp-bar .crumb{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cp-bar .crumb b{color:var(--lime)}
.cp-hero{position:relative;padding:clamp(50px,7vw,100px) var(--gut) clamp(40px,5vw,70px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,4vw,60px);align-items:end;overflow:hidden}
.cp-hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.8}
.cp-hero>*{position:relative;z-index:1}
.cp-hero h1{margin:10px 0 0;font-size:clamp(48px,9vw,160px);line-height:.86}
.cp-logo{justify-self:end;width:min(100%,360px);aspect-ratio:16/10;border-radius:14px;background:var(--paper);display:grid;place-items:center}
.cp-logo img{max-width:62%;max-height:52%;object-fit:contain}
.cp-logo.w{background:var(--char)}
.cp-logo.none{background:var(--char) var(--contour) center/cover}
.cp-logo.none b{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;padding:0 20px;text-align:center}
.cp-stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-inline:var(--gut)}
.cp-stats div{padding:22px 0 22px 18px;border-left:1px solid var(--line)}
.cp-stats div:first-child{border-left:0;padding-left:0}
.cp-stats b{display:block;font-size:clamp(34px,4vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1}
.cp-stats span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cp-body{padding:clamp(40px,5vw,70px) var(--gut);display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:clamp(24px,4vw,60px);align-items:start}
.cp-serv{position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}
.cp-serv h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.cp-serv ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cp-serv li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.cp-serv li span{color:var(--mute);font-weight:600;font-size:13px}
.cp-serv p{margin:0;color:#c9ccbd;font-size:13px}
.cp-works{columns:3 240px;column-gap:16px}
.cp-card{display:block;width:100%;margin:0 0 16px;break-inside:avoid;position:relative;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--char) var(--contour) center/cover;text-align:left}
.cp-card img{width:100%;height:auto;display:block;transition:transform .8s var(--ease)}
.cp-card:hover img{transform:scale(1.05)}
.cp-card .nothumb{aspect-ratio:var(--ar,1);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:18px}
.cp-card .nothumb b{font-size:20px;font-weight:800;text-transform:uppercase;line-height:1;letter-spacing:-.03em}
.cp-card .nothumb small{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.cp-card .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(10,11,8,.92))}
.cp-card .cap span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.cp-card .cap b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.cp-card .ty{position:absolute;left:10px;top:10px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(10,11,8,.75);padding:4px 7px;border-radius:4px}

.ot-pics{position:absolute;inset:0;pointer-events:none}
.ot-pics img{position:absolute;width:clamp(150px,19vw,330px);aspect-ratio:3/4;object-fit:cover;border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.ot-nums-foot{position:relative;display:grid;grid-template-columns:1.2fr 1fr auto;align-items:end;gap:30px;margin-top:4vh}
.ot-nlabel{margin:0;font-size:clamp(22px,2.4vw,40px);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:1}
.ot-nlabel b{color:var(--lime)}
.ot-mini{display:flex;gap:clamp(20px,3vw,50px)}
.ot-mini div{display:flex;flex-direction:column}
.ot-mini b{font-size:clamp(34px,3.4vw,58px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.ot-mini span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-top:6px}
.ot-nums .row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:860px){
  .ot-hero{grid-template-columns:1fr;grid-template-rows:auto auto;padding-top:86px}
  .ot-big{font-size:22vw;text-align:left;margin-top:.55em}
  .ot-script{font-size:19vw;top:-.05em}
  .ot-info{grid-column:1;padding-top:62vw}
  .ot-meta{font-size:11px}
  .ot-grid{grid-template-columns:1fr 1fr 1fr}
  .g-prev{grid-row:auto}.g-fmt{grid-column:1/3;grid-row:auto;border-top:1px solid rgba(10,11,8,.2)}
  .g-num{grid-column:3;grid-row:1/3}.g-sig{display:none!important}
  .g-num b{font-size:60px}
  .ot-cue{display:none}
  .ot-state{padding:14vh var(--gut) 8vh}
  .ot-say{font-size:12.5vw}
  .ot-slot{width:46vw}
  .ot-nums-foot{grid-template-columns:1fr;gap:20px}
  .ot-giant{font-size:78vw}.ot-giant.long{font-size:40vw}
}
@media (prefers-reduced-motion:reduce){.ot-cue i{animation:none}}
